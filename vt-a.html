<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<title>頁面 A</title>
<style>
/* 這一行就是全部：告訴瀏覽器同源導覽時自動做轉場 */
@view-transition { navigation: auto }

:root{color-scheme:dark}
body{margin:0;height:100vh;display:grid;place-items:center;align-content:center;gap:13px;
  background:#0e1016;color:#e9ecf5;
  font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
h1{margin:0;font-size:14px;letter-spacing:.06em;color:#a5adc2;view-transition-name:mpa-title}
.card{width:152px;height:86px;border-radius:16px;display:grid;place-items:center;
  font:800 30px ui-monospace,SFMono-Regular,Menlo,monospace;color:#0a0b0f;
  background:linear-gradient(135deg,#6ee7b7,#7dd3fc);
  view-transition-name:mpa-card}
a{color:#7dd3fc;font:600 12.5px system-ui,sans-serif;text-decoration:none;
  border:1px solid #333849;padding:7px 15px;border-radius:999px;
  view-transition-name:mpa-link}

/* 兩個文件之間同名的元素會自動 morph；這裡只是調整它的節奏 */
::view-transition-group(mpa-card){
  animation-duration:.55s;
  animation-timing-function:cubic-bezier(.34,1.4,.64,1);
}
</style>
<h1>頁面 A ／ 這是一份獨立的 HTML 文件</h1>
<div class="card">A</div>
<a href="vt-b.html">前往頁面 B →</a>
