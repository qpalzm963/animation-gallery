}

/* 主題（預設日間）/ 減少動態 */
/* 網址參數 ?theme=dark&lang=ja 可直接指定主題與語言（分享用；不覆寫既存偏好） */
const QS=new URLSearchParams(location.search);
let curTheme=localStorage.getItem('dmTheme');
if(QS.get('theme')==='dark'||QS.get('theme')==='light')curTheme=QS.get('theme');
if(curTheme!=='dark')curTheme='light';
function applyTheme(){
  document.documentElement.dataset.theme=curTheme;
  $('#themeBtn').textContent=curTheme==='light'?'☾':'☀︎';
}
$('#themeBtn').onclick=()=>{
  curTheme=curTheme==='light'?'dark':'light';
  applyTheme();
  try{localStorage.setItem('dmTheme',curTheme);}catch(_){}
};
function setMotion(off){
  document.documentElement.classList.toggle('no-motion',off);
  $('#motionBtn').textContent=off?UI[curLang].motionOn:UI[curLang].motionOff;
}
$('#motionBtn').onclick=()=>setMotion(!document.documentElement.classList.contains('no-motion'));

P 从旧位置滑到新位置。没有这个动画，用户会完全跟丢自己在看的那一列。","when":"排序切换、筛选、拖拽排序、实时排行榜。"},"morphradius":{"title":"形状变形","desc":"border-radius 的八个值可以独立补间，不用 SVG 就能做出流动的有机形状。","when":"装饰性的背景形状、avatar 容器、品牌感的 blob。纯 CSS、成本极低。"},"accordion":{"title":"高度自动展开","desc":"height:auto 不能补间。用 grid-template-rows 从 0fr 到 1fr 就能动 —— 这是目前最干净的纯 CSS 解法。","when":"手风琴、展开更多、可折叠的表单区块。取代量测 scrollHeight 再设 px 的老写法。"},"reveal":{"title":"卷入显现","desc":"元素进入窗口才播放进场动画。用 IntersectionObserver，不要监听 scroll 事件 —— 前者由浏览器在合成线程判定，不会拖慢滚动。","when":"长页面的内容区块、行销页。只播一次就 unobserve，来回滚动一直重播很烦人。"},"parallax":{"title":"视差滚动","desc":"不同深度的图层用不同倍率位移，远的慢、近的快，造出景深。倍率差别建议控制在 0.1–0.4 之间，过大会头晕。","when":"首屏英雄区、品牌故事页。务必在 prefers-reduced-motion 时关掉，这是最容易诱发晕眩的手法。"},"scrollprog":{"title":"滚动进度","desc":"把滚动位置映射成 0–1，再驱动任何视觉属性。动画的“时间轴”被换成了“位置轴”，用户完全掌控播放。","when":"长文阅读进度、章节导览、把滚动当成播放头的叙事页。"},"sticky":{"title":"钉住场景","desc":"画面用 position:sticky 钉住不动，旁边的文字继续卷，卷到哪一段就切换画面状态。滚动变成了叙事的节拍器。","when":"产品功能解说、数据故事、教学步骤。是 scrollytelling 的骨架。"},"scrolltimeline":{"title":"原生滚动时间轴","desc":"CSS 直接把 @keyframes 的时间轴换成滚动轴，完全不写 JavaScript，而且跑在合成线程上，卷多快都不掉帧。","when":"任何跟滚动绑定的视觉。这是取代大半 scroll-linked JS 的原生解，不支持时会静静退回原状。"},"typewriter":{"title":"打字机","desc":"用 steps() 让宽度一格一格跳，配上一根闪烁光标。纯 CSS 版本要求等宽字体，宽度用 ch 单位算。","when":"终端机界面、AI 回复的拟真感、首页标语。长文用它会让人失去耐性。"},"scramble":{"title":"乱码解码","desc":"每个字符先随机跳字，再依序“锁定”成正确的字。锁定顺序由左到右，才会有解码的方向感。","when":"科技感的标题、加载完成的揭示、密码／代号类的 UI。"},"splittext":{"title":"逐字错位","desc":"把文字拆成一个个 span，各自延迟进场。拆字要保留空白与换行语意，否则屏幕阅读器会把整句念成散字。","when":"标题揭露、品牌开场。务必给外层 aria-label 保留原句给辅助科技。"},"maskreveal":{"title":"遮罩上推","desc":"外层 overflow:hidden，内层整行往上推。字看起来是从一条看不见的线后面“长出来”，比淡入有分量得多。","when":"大标题、章节名、电影感的开场。行高要留够，否则上缘会被切到。"},"counter":{"title":"数字滚动","desc":"数值从 0 补间到目标值，尾段要用 ease-out 慢下来 —— 等速的数字跳动看起来像故障而不是统计。","when":"仪表板、成绩揭晓、募资金额。位数要固定宽度，否则整排会抖动。"},"marquee":{"title":"无限跑马灯","desc":"内容复制两份，整条移动 -50% 后瞬间归零 —— 因为两份一模一样，接缝完全看不出来。必须用 linear。","when":"logo 墙、公告条、标签云。hover 时暂停是基本礼貌，不然用户根本读不到。"},"varfont":{"title":"可变字体","desc":"可变字体的字重、字宽是连续轴，可以直接补间。以前只能在几个离散字重之间硬切，现在能真的“长胖”。","when":"需要呼吸感的标题、hover 反馈、数据可视化的权重编码。需要系统或加载的字体支持可变轴。"},"kinetic":{"title":"动态文字排版","desc":"文字本身就是主角：尺寸、位置、节奏随语意变化。重点是“节拍”—— 每个词停留的长度要对上想像中的语调。","when":"开场动画、宣言页、视频字卡。信息密度低但情绪浓度高的场合。"},"linedraw":{"title":"线条描绘","desc":"把 dasharray 设成路径总长，再把 dashoffset 从总长animate 到 0，虚线的空隙就“走完”整条路径，看起来像被画出来。","when":"logo 开场、图表折线进场、插画描边。路径长度用 path.getTotalLength() 取得。"},"pathfollow":{"title":"沿路径移动","desc":"offset-path 让元素沿任意曲线前进，offset-rotate 让它自动转向切线方向。这是“弧线法则”最直接的实作。","when":"导览指示、游戏化的路径、加载时绕圈的装饰。纯 CSS，不需要 SVG 动画。"},"clipwipe":{"title":"几何遮罩扩散","desc":"clip-path 的 circle() 从触发点半径 0 展开到盖满。这是 Material Design 的招牌转场，也是 View Transitions 最常见的自订效果。","when":"深浅色主题切换、从按钮展开的全屏幕菜单。圆心要设在用户刚刚点的位置。"},"checkmark":{"title":"打勾绘制","desc":"圆圈先画完、打勾后画，两段有 150ms 的重叠。顺序与重叠量决定了它是“确认”还是“庆祝”。","when":"表单送出成功、付款完成、待办勾选。是最值得花时间打磨的微交互之一。"},"gradmask":{"title":"渐层遮罩擦除","desc":"用一条渐层当遮罩并移动它，边界是柔的而不是刀切的。比 clip-path 贵一点，但质感差很多。","when":"文字逐段显现、图片柔性揭露、串流输出时的渐显尾巴。"},"pathmorph":{"title":"路径变形","desc":"直接补间 path 的 d 属性。前提是两个形状的指令数量与类型必须一致，否则要先做点数对齐。","when":"icon 之间的转换（播放↔暂停、菜单↔关闭）、数据图形的形状切换。"},"magnetic":{"title":"磁吸","desc":"光标进入范围后，组件朝光标偏移一小段距离（通常是位移量的 30%）。它让按钮看起来“想被按”。","when":"CTA 主按钮、作品集的交互元素。一页最多一两个，满版都是磁吸会变成杂讯。"},"trail":{"title":"拖尾光标","desc":"每一颗点都用线性插值追前一颗：pos += (target - pos) * 0.3。系数越小越黏、拖得越长。","when":"作品集、实验性网站。务必只在有精准指针时激活（pointer: fine），触摸设备没有光标。"},"inertia":{"title":"惯性滑行","desc":"放手时记住当下速度，之后每帧乘上摩擦系数（0.94 左右）继续滑，直到速度小到看不见为止。","when":"自订轮播、地图平移、可拖拽画布。没有惯性的拖拽会让人觉得界面“黏在手上甩不掉”。"},"rubber":{"title":"橡皮筋阻尼","desc":"超出边界之后，位移量被开根号式地压缩 —— 拖得越远、增加得越少，放手弹回。iOS 卷到底的手感就是这个。","when":"自订滚动容器、抽屉下拉关闭、轮播的头尾。它在“还能继续吗”这个问题上给出触觉式的答案。"},"particles":{"title":"粒子系统","desc":"几百个各自有速度的点，在 canvas 上每帧重画。DOM 撑不住这种数量，超过 ~60 个元素就该换 canvas。","when":"背景氛围、庆祝彩带、数据点的粒子化。记得在离开窗口时 cancelAnimationFrame，否则背景一直吃电。"},"ripple":{"title":"触点波纹","desc":"从实际触点扩散的圆，同时放大与淡出。关键是圆心用点击座标，而不是组件中心 —— 那才叫反馈。","when":"按钮、列表项、任何可点击的大面积区块。是“我收到了”最低成本的表达。"},"tilt":{"title":"3D 倾斜卡片","desc":"依光标位置给 rotateX / rotateY，同时让一道高光沿反方向移动。高光才是让它看起来像实体材质的关键。","when":"作品卡、商品卡、会员卡。角度控制在 ±12° 以内，超过就会从“立体”变成“歪掉”。"},"cardflip":{"title":"翻牌","desc":"两面叠在一起，背面预先转 180°，容器整个转。backface-visibility:hidden 负责藏起背对镜头的那一面。","when":"记忆游戏、正反信息切换、统计卡的“看细节”。翻转轴选 Y 比 X 自然，因为书就是这样翻的。"},"cube":{"title":"立方体旋转","desc":"六个面各自 rotate 再 translateZ 半个边长，父层 preserve-3d。这是 CSS 3D 最基本的组装方式。","when":"loading、logo、数据多面向的切换。手机上要注意：3D 合成层很吃内存。"},"layerdepth":{"title":"鼠标分层视差","desc":"光标移动时，不同深度的图层以不同幅度反向偏移。等于用二维画面伪造出视角变化。","when":"首屏插画、产品照、卡片内部的层次。位移幅度分配要跟视觉上的远近一致，否则会觉得怪。"},"coverflow":{"title":"透视列表","desc":"项目沿 Y 轴旋转并往后推，形成弧形排列。深度差让“现在选中哪一个”不需要任何额外标示。","when":"封面浏览、卡片选择器、日期滚轮。是 iOS picker 的视觉原型。"},"shimmer":{"title":"骨架屏微光","desc":"灰块上扫过一道斜向高光。它的作用不是好看，而是声明“这里正在加载，不是空的”。","when":"数据加载中。骨架的形状要接近真实内容，否则内容进来时会有一次难看的重排。"},"gradflow":{"title":"流动渐层","desc":"渐层做得比容器大好几倍，再移动 background-position。没有任何元素在动，却感觉整片在呼吸。","when":"英雄区背景、AI 生成中的状态、品牌氛围。速度要慢（8s 以上），快了会很吵。"},"glow":{"title":"呼吸光晕","desc":"box-shadow 的模糊半径与透明度同步变化。节奏刻意接近人的呼吸（3–4 秒一次）才会觉得平静而非焦虑。","when":"录音中、AI 聆听中、待机的语音助理。急促的闪烁是警告，缓慢的呼吸是等待。"},"grain":{"title":"颗粒噪点","desc":"用 SVG 的 feTurbulence 生成杂讯图层叠在上面，再让它轻微位移。数字渐层太干净，加了颗粒才有实体感。","when":"编辑风格的版面、音乐／图像类产品。透明度压在 6–12%，过了就变脏。"},"glass":{"title":"玻璃模糊","desc":"backdrop-filter 模糊的是“身后”的东西。它创建了层级关系：模糊的那层在后面、清楚的在前面。","when":"浮动工具列、弹窗背景、iOS 风格的 sheet。backdrop-filter 很贵，别在滚动中的长列表用。"},"goo":{"title":"液态融合","desc":"先高斯模糊、再用 feColorMatrix 把 alpha 对比拉到极限，模糊的边缘就被“切”回硬边，靠近的形状因此黏在一起。","when":"展开式的浮动按钮、有机感的加载、品牌装饰。滤镜成本高，范围越小越好。"},"glitch":{"title":"故障艺术","desc":"同一段文字叠三层，两层伪元素用 clip-path 切成不同的水平带并左右错位，再让切法快速跳动。","when":"游戏、音乐、黑客风格的视觉。务必短促且不常出现，长时间闪动会让人不适甚至诱发光敏反应。"},"chromatic":{"title":"色差","desc":"把红、青两个色版往相反方向偏移几像素，模拟镜头边缘的色散。很轻的成本，很强的氛围。","when":"标题的细微躁动、hover 反馈、复古 CRT 质感。偏移量 1–3px 就够了。"},"sprite":{"title":"逐格动画","desc":"把每一格画面排成一条，用 steps() 让位移“跳”而不是“滑”。这是传统赛璐珞动画在 CSS 里的直译。","when":"像素风、手绘逐格、GIF 的替代方案（文件更小、可控制播放）。格数与时长要整除，否则会抖。"},"wave":{"title":"波浪网格","desc":"把 delay 设成跟座标有关的函数（例如 (x+y)×0.06s），一整片元素就会呈现波形扩散，而不是各自为政。","when":"数据矩阵的加载、音频可视化、背景装饰。是“用延迟写方程式”最直观的例子。"},"curtain":{"title":"幕帘转场","desc":"数片色块依序盖满画面，在全黑的瞬间换掉内容，再依序退开。旧内容何时消失被完全藏在幕后。","when":"页面切换、章节分隔。是在无法用 View Transitions 时，遮住换页闪烁最可靠的做法。"},"dissolve":{"title":"像素溶解","desc":"把画面切成网格，每一格用随机延迟淡出。随机性让它不像“动画”，更像材质在崩解。","when":"删除、销毁、数据清除的反馈。给了“东西真的没了”的实感，比单纯淡出有力得多。"},"liquidnav":{"title":"弹性指示器","desc":"指示器移动途中先横向拉长、到位再收回。这一个 scaleX 就把“跟随与重叠”法则用在了两点之间的位移上。","when":"页签、底部导览、分段控制项。是少数能让纯功能组件显得有个性的地方。"},"orbit":{"title":"轨道系统","desc":"父层负责旋转轨道、子层反向旋转抵销自转，对象就会沿圆周移动而保持正面朝上。组合式 transform 的经典题。","when":"技术架构图、集成生态的展示、加载中的多节点状态。"},"startingstyle":{"title":"进场也能转场","desc":"声明元素“刚出现在画面上的那一刻”长什么样。过去元素刚插入 DOM 没有前一个状态可比，transition 根本不会触发，只能靠强制 reflow 硬骗浏览器。","when":"任何动态插入的元素：toast、下拉菜单、刚加载完的卡片。这是十几年来 CSS 进场动画最大的一块拼图。"},"discrete":{"title":"离散属性转场","desc":"display 这种“没有中间值”的属性过去完全不参与 transition。allow-discrete 让它在转场的头尾切换，中间的过程交给其他属性演完。","when":"popover、<dialog>、任何要从 display:none 进出的东西。跟 @starting-style 凑成三件套之后，JS 只要 toggle 一个 class，两个方向都会动。"},"autoheight":{"title":"height:auto 可补间","desc":"interpolate-size:allow-keywords 让 auto、min-content 这些关键字变成可补间的值。展开高度终于不用先量 scrollHeight 再写死 px。","when":"手风琴、展开更多、聊天消息串。取代本图鉴“高度自动展开”那张用的 grid-template-rows: 0fr→1fr —— 但旧招在支持度不足的环境仍然是正解，别急着全站换掉。"},"linearspring":{"title":"纯 CSS 弹簧","desc":"linear() 用一串采样点描述任意曲线。cubic-bezier 只有两个控制点，最多过冲一次；linear() 可以来回震荡，也就是说弹簧终于不用写 JavaScript。","when":"需要弹性个性又不想引进动画函数库时。三条预设命名可以直接抄 —— 这组语汇正好对应 SwiftUI 的 .smooth / .snappy / .bouncy。"},"propgradient":{"title":"自订属性可补间","desc":"没注册类型的自订属性对浏览器来说只是一串文字，动画时会在 50% 直接跳过去。用 @property 声明 syntax 之后它才变成真正的角度、颜色或长度。","when":"渐层旋转、颜色停驻点、任何“本来不可补间”的东西。左边已注册、右边没注册，差别一眼可见。"},"multitrack":{"title":"多轨道时间轴","desc":"一组 @keyframes 里所有属性共用同一条时间轴。想让旋转跟位移各有各的节奏，CSS 得靠嵌套元素拆开 —— 因为多个 animation 同时写 transform 会互相覆盖。","when":"有机感的持续动态、吉祥物、加载中的复合动画。SwiftUI 的 KeyframeAnimator 用 KeyframeTrack 原生支持这件事，是少数 CSS 比较吃力的地方。"},"vt-custom":{"title":"自订新旧画面","desc":"预设的转场只是把旧画面淡出、新画面淡入。分别对 ::view-transition-old() 与 -new() 下动画，就能让旧的往左退、新的从右进。","when":"页签切换、步骤流程、任何有方向感的内容替换。这是把“原生转场”从堪用变好用的第一步。"},"vt-group":{"title":"控制 morph 节奏","desc":"同名元素之间的位置与尺寸变化由 group 这一层负责。对它下 animation-duration 与曲线，就能决定 morph 走得多快、要不要过冲。","when":"共享元素转场需要个性的时候。旧新画面的内容淡入淡出归 old/new 管，形状怎么飞归 group 管，两者可以分开调。"},"vt-types":{"title":"方向感知转场","desc":"startViewTransition 可以带 types，CSS 端用 :active-view-transition-type() 接。同一组元素，往前和往后可以走完全相反的动画。","when":"有前后关系的导览：分页、精灵流程、浏览纪录。没有方向感的转场会让用户失去“我在哪”的感觉。"},"vt-clash":{"title":"撞名会静默失效","desc":"同一时间有两个元素叫同一个 view-transition-name，整个转场会被直接跳过 —— 画面瞬间切换，主控台一片安静。左边命名唯一、右边两个同名，点一下看差别。","when":"这张是排错用的。转场“没作用又没错误消息”时第一个该查的就是撞名，尤其在组件被重复渲染的清单里。"},"vt-list":{"title":"清单展开详情","desc":"点下去的那一项，缩略图与标题临时挂上 view-transition-name，转场结束再拿掉。名字只在需要的那一瞬间存在，就不会跟清单里其他项目撞名。","when":"清单 → 详情、商品 → 商品页、相册 → 大图。这是原生 App 感最大的来源，而且不需要任何框架。"},"vt-mpa":{"title":"跨文档转场","desc":"@view-transition { navigation: auto } 一行就让同源的“真实换页”也有转场。下面 iframe 里是两个独立的 .html，没有任何框架、没有 SPA router。","when":"博客、文档站、电商、任何多页式网站。过去要有 App 级转场只能整站改 SPA，现在不用了。"}},"laws":[{"title":"挤压与伸展 Squash & Stretch","desc":"按钮按下时微微变扁、放开时回弹。体积守恒的形变让组件有材质与重量，而不是一张贴纸。"},{"title":"预备动作 Anticipation","desc":"菜单展开前先反向缩一下。给眼睛一个“要发生事情了”的提示，之后的主动作才跟得上。"},{"title":"演出布局 Staging","desc":"一次只让一件事成为主角。同时三个东西在动＝没有东西在动，用户的视线会不知道要放哪。"},{"title":"连续／关键帧 Pose to Pose","desc":"界面几乎全是 pose to pose：定义 A 状态与 B 状态，中间交给补间。CSS transition 就是这个思维。"},{"title":"跟随与重叠 Follow Through","desc":"卡片停了，里面的文字晚 40–80ms 才停。对象不会整齐划一地同时煞车，错开才有生命。"},{"title":"慢进慢出 Slow In & Out","desc":"现实中没有等速运动。<code>linear</code> 只留给无限旋转的 loading 与跑马灯，其余一律用 ease。"},{"title":"弧线 Arc","desc":"自然的运动走曲线。直线位移看起来机械，用 <code>offset-path</code> 或分离 X/Y 的不同 easing 就能造出弧。"},{"title":"次要动作 Secondary Action","desc":"主动作之外的小细节：卡片升起时阴影同步变深变散。它强化主动作，不能抢戏。"},{"title":"时间掌控 Timing","desc":"时长就是重量。同样的位移，300ms 是轻巧、800ms 是笨重。改时间比改曲线更能改变个性。"},{"title":"夸张 Exaggeration","desc":"超过目标再回弹，比精准到位更有说服力。overshoot 曲线 <code>cubic-bezier(.34,1.56,.64,1)</code> 就是这条法则。"},{"title":"立体感 Solid Drawing","desc":"3D 转场一定要给 <code>perspective</code>，否则翻转看起来像被压扁的纸片，不是有厚度的对象。"},{"title":"吸引力 Appeal","desc":"动画是产品的口音。整站共用同一组 easing 与时长阶梯，用户才会觉得“这个 app 有个性”。"}],"rules":[{"title":"只动 transform 与 opacity","desc":"这两个属性可以完全交给 GPU 合成。动 <code>width/top/margin</code> 会触发 layout，60fps 立刻崩。"},{"title":"退场永远比进场快","desc":"常见比例 2:1。进场是邀请、退场是让路，用户不想等一个他已经关掉的东西。"},{"title":"可被打断","desc":"用户中途改变主意时，动画要从当下状态接续，而不是播完再反应。Web Animations API 比 CSS 好处理这件事。"},{"title":"尊重 reduced-motion","desc":"前庭功能敏感者会因为视差与大位移晕眩。用 <code>@media (prefers-reduced-motion:reduce)</code> 降级成单纯淡入，不要整个关掉。"},{"title":"动画是状态的解释","desc":"好的动画在回答“这个东西从哪来、要去哪”。回答不出来的动画就是装饰，该砍。"},{"title":"一致性大于精彩","desc":"整站 3 条 easing、4 个时长级距就够了。每个组件自订曲线＝没有设计系统。"}],"other":[{"title":"KeyframeAnimator 多轨道","desc":"每个属性各有一条独立时间轴。CSS 一组 <code>@keyframes</code> 绑死所有属性，想拆只能靠嵌套元素。"},{"title":"PhaseAnimator 阶段串行","desc":"用一串离散阶段驱动，每次切换自动补间。Web 要自己写一个 state machine 再切 class。"},{"title":"scrollTransition 的 phase","desc":"<code>.topLeading</code> / <code>.identity</code> / <code>.bottomTrailing</code> 三段式，比 IntersectionObserver 的“进来了没”细致得多。"},{"title":".symbolEffect()","desc":"SF Symbols 内置 bounce / pulse / variableColor / replace。Web 完全没有“图标自带动画”这个概念。"},{"title":"语意化 spring","desc":"<code>.smooth</code> / <code>.snappy</code> / <code>.bouncy</code> 把物理参数包成设计语汇。CSS 只能用 <code>linear()</code> 逼近，没有共同命名。"},{"title":".contentTransition(.numericText())","desc":"系统级的数字滚动。本图鉴那张“数字滚动”是自己用 rAF 刻的。"},{"title":".sensoryFeedback 触觉同步","desc":"动画表现的第四个维度。Web 只有很弱的 Vibration API，而且桌机没有。"},{"desc":"<code>GlassEffectContainer</code> + <code>glassEffectID</code>（iOS 26）是系统级的液态融合：可交互、随手势折射、还会 morph。本图鉴的“液态融合”只是用 SVG 滤镜模拟视觉。"},{"desc":"两个路由的组件放同一个 tag，共享元素转场就完成了。Web 要手刻 FLIP，或用还在普及中的 View Transitions。"},{"title":"Curves 全家族","desc":"40+ 条具名曲线（<code>easeOutBack</code>、<code>elasticIn</code>、<code>bounceOut</code>…）。不用背 cubic-bezier 的四个数字。"},{"title":"Impeller 的 shader 预热","desc":"<code>.frag</code> 在编译期就编好，不像 Web 首次运行 shader 会卡一下。"}],"cross":[{"concept":"缓动曲线","flutter":"<code>Curves.easeOutCubic</code>（内置 40+ 条具名曲线）","swiftui":"<code>.easeOut</code>、语意化的 <code>.smooth</code> / <code>.snappy</code> / <code>.bouncy</code>"},{"concept":"关键帧","css":"<code>@keyframes</code>（所有属性共用一条时间轴）","swiftui":"<code>KeyframeAnimator</code>（每个属性一条 <code>KeyframeTrack</code>）"},{"concept":"状态改变自动补间"},{"concept":"手动控制播放","flutter":"<code>AnimationController</code>（explicit，记得 <code>dispose</code>）","swiftui":"<code>withAnimation</code> + 自订状态"},{"concept":"共享元素转场","css":"FLIP 手刻 / View Transitions API","flutter":"<code>Hero</code>（同一个 tag 就完成，几乎免费）"},{"concept":"弹簧物理","css":"<code>linear()</code> 近似 / JS 逐帧模拟"},{"concept":"错位延迟","flutter":"单一 controller + <code>Interval</code> 切段"},{"concept":"滚动驱动","swiftui":"<code>scrollTransition</code>（三段式 phase）"},{"concept":"材质模糊"},{"concept":"自订绘图"},{"concept":"Shader / 滤镜"},{"concept":"页面转场","swiftui":"NavigationStack 转场、<code>.zoom</code>"},{"concept":"可中断的手势转场","css":"全部手刻","flutter":"要自己接手势与 controller","swiftui":"系统内置，是 iOS 的招牌"}],"duration":[{"when":"hover / 按下反馈","why":"必须跟手。超过 200ms 就会被感知成“卡”。"},{"when":"小组件开合<br>（tooltip、下拉）","curve":"进 <code>ease-out</code><br>出 <code>ease-in</code>","why":"进场要立刻可见所以先快后慢；退场用户已不在乎，慢起快走直接让开。"},{"when":"卡片展开 / 抽屉 / Modal","why":"面积大、位移大，需要时间交代空间关系。"},{"when":"页面转场","why":"两端都慢，中段快，像镜头推移而不是瞬移。"},{"when":"大对象位移 / 拖拽释放","curve":"刚性 0.08 / 阻尼 0.75","why":"有惯性的东西不该有固定时长，物理模拟比 duration 准。"},{"when":"Loading / 跑马灯","why":"无限循环一旦有 ease 就会出现“心跳”节点，反而显得不顺。"},{"when":"列表逐项进场","dur":"每项 delay 30–60ms","why":"间隔太大会让最后一项等太久；超过 8 项就该分批或改用单一群组动画。"}]},"ja":{"ui":{"heroTitle":"アニメーション表現<em>図鑑</em>","lede":"ありふれたフェードや移動から、FLIP・スクロールタイムライン・グーイーエフェクト・グリッチアートといった少し珍しい手法まで。どのカードも<strong>実際に動いている</strong>実装で、使いどころの解説と、そのままコピーできるコアコードが付いています。","searchPh":"技法・キーワードを検索…","fwLab":"Prompt 対象","fwTitle":"コピーする Prompt をどのフレームワーク向けに生成するか","copyAll":"すべてコピー（{n}）","replayAll":"すべて再生","motionOff":"動きを一時停止","motionOn":"動きを再開","themeTitle":"テーマ切り替え","langBtn":"JA","langTitle":"言語","all":"すべて","empty":"該当する技法が見つかりません。","s01n":"01","s01h":"技法図鑑","s01d":"上のカテゴリや検索で絞り込めます。カードにホバーするか「リプレイ」を押すともう一度再生できます。ホバー・クリック・ドラッグで発動する技法もあり、その場合はタグに明記しています。","viewCode":"コードを見る","replay":"↻ リプレイ","copyPrompt":"⧉ Prompt をコピー","copied":"コピーしました ✓","copyFail":"コピー失敗","copyfallMsg":"ブラウザが自動コピーをブロックしました（ウィンドウにフォーカスがない、または file:// で開いている場合に起こります）。下のテキストは選択済みなので、そのまま ⌘C / Ctrl+C を押してください。","copyfallClose":"閉じる","rmNotice":"システムの「動きを減らす（reduce motion）」設定を検出したため、すべてのデモアニメーションを自動的に一時停止しました。","rmResume":"それでも見る","footer":"単一の HTML ファイル・依存ライブラリゼロ・すべてネイティブの CSS / Web Animations API / Canvas。<br><b>各カードに載っているコードは、このページで実際に動いているコードそのもの</b>です。そのままコピーできます。","s02n":"02","s02h":"アニメーションの12原則 → インターフェース対応","s02d":"1930年代にディズニーがまとめた12原則は、あらゆるモーション表現の基礎文法です。懐古趣味ではなく、インターフェースの語彙に置き換えれば、今もすべて現役です。","s03n":"03","s03h":"クロスプラットフォーム対照表","s03d":"同じ表現が、3つのプラットフォームでそれぞれ何と呼ばれるか。この表の目的は API を調べることではなく、「CSS の書き方をそのまま Flutter に直訳する」のを防ぐことです。各プラットフォームには、それぞれもっと自然な道があります。","s04n":"04","s04h":"他プラットフォーム固有の表現","s04d":"これらは Web に対応物がありません。「まだ実装されていない」のではなく、メンタルモデルそのものが違うのです。クロスプラットフォーム開発では、自分に何が足りず、何が余分にあるのかを知っておく価値があります。","s05n":"05","s05h":"デュレーションとイージングの早見表","s05d":"何ミリ秒にすべきか迷ったら、まずこの表から写して、実際の感覚で微調整してください。原則：入りは速く、出はさらに速く。距離が長いほど時間も長くなりますが、その伸びは線形以下です。","durTh":["シチュエーション","推奨時間","曲線","理由"],"crossTh":["概念","CSS / Web","Flutter","SwiftUI"],"docTitle":"アニメーション表現図鑑 — Motion Design Field Guide","linkTitle":"このカードへのリンクをコピー"},"trig":{"auto":"自動再生","hover":"ホバー","click":"クリック","drag":"ドラッグ","scroll":"スクロール"},"cats":{"basic":"基本の変化","timing":"タイミングとイージング","layout":"レイアウトトランジション","scroll":"スクロール連動","text":"テキストアニメーション","svg":"描画とマスク","physics":"物理とインタラクション","depth":"空間と3D","surface":"光と質感","special":"実験的表現","modern":"モダン CSS トランジション","vt":"View Transitions"},"demos":{"fade":{"title":"フェード","desc":"opacity だけを動かします。最も低コストで失敗しにくく、あらゆるフォールバックの終着点でもあります。","when":"空間的な関係を伝える必要のないコンテンツ差し替えに。単体ではやや平板なので、小さな移動と組み合わせるのが定番です。"},"rise":{"title":"フェードアップ","desc":"opacity に 8–24px の移動を組み合わせます。移動量は小さく——大きすぎると「浮かび上がる」ではなく「飛び込んでくる」ように見えます。","when":"ほぼすべてのコンテンツ登場のデフォルト。リスト、カード、セクション見出しに。"},"pop":{"title":"スケールポップ","desc":"0.85 から 1 へ、オーバーシュートする曲線で拡大します。開始値を 0 にしないこと——「ポップする」ではなく「無から出現する」ように見えてしまいます。","when":"モーダル、ツールチップ、通知、いいねボタン。注意を引きたい小さなコンポーネントに。"},"spin":{"title":"スピン","desc":"無限回転は linear が正解となる数少ない場面です。イージングを付けると 1 周ごとに「引っかかり」が生まれ、かえって滑らかさを失います。","when":"所要時間が読めないローディングに。進捗が分かるならプログレスバーを——スピナーが伝えられるのは「まだ生きている」ことだけです。"},"blurin":{"title":"ブラーイン","desc":"filter: blur(12px) から 0 へ収束させ、レンズのピント合わせを模します。視覚的な存在感は大きいものの、blur は高コストなフィルターです。","when":"ファーストビューのヒーロービジュアルや画像の読み込み完了時に。同一画面で 2 つまで、長いリストでは使わないこと。"},"flipin":{"title":"フリップイン","desc":"X 軸まわりに回転して登場します。ポイントは親要素に perspective を与えること。ないと単なる縦方向の潰れに見えます。","when":"データカード、統計値の更新、めくり式のコンテンツ差し替えに。"},"wipein":{"title":"方向ワイプ","desc":"clip-path の inset を徐々に開き、コンテンツ自体は動かしません。opacity だけよりも「明かされる」儀式感があります。","when":"画像の登場、見出しのリビール、タブ切り替えに。方向はユーザーの読み進む動線に合わせます。"},"easing":{"title":"イージング比較","desc":"同じ距離、同じ時間で、曲線だけを変えたもの。個性の違いはほぼすべてこの一本の曲線から生まれ、移動量からではありません。","when":"デザインシステムのイージング階層を決めるときは、候補の曲線を並べて実際に走らせるのが一番。数値を眺めるよりはるかに確実です。"},"spring":{"title":"スプリング物理","desc":"duration を持たず、剛性と減衰だけを設定して毎フレーム速度を再計算します。目標が途中で変わっても自然につながります。","when":"ドラッグ＆リリース、ジェスチャー駆動など、ユーザーが途中で気を変える可能性のあるインタラクション全般に。"},"overshoot":{"title":"オーバーシュート","desc":"cubic-bezier の y 値が 1 を超えると、目標を通り過ぎてから戻ってきます。上段はぴったり停止、下段はオーバーシュートです。","when":"「弾む」個性が欲しいコンポーネントに。テキスト組版には不向き——文字が揺れて読みにくくなります。"},"anticipation":{"title":"予備動作","desc":"本動作の前に、逆方向へ小さく「タメ」を入れます。上段はそのまま出発、下段はタメてから——下段の方が「意図がある」ように見えます。","when":"重要な一回きりのトランジションに。リスト項目には使わないこと。繰り返されるとくどく感じられます。"},"stagger":{"title":"スタガー","desc":"同じアニメーションを、項目ごとに少しずつ遅らせて開始します。40ms 前後が最も心地よく、大きすぎると間延びし、小さすぎると同時に見えます。","when":"リスト、カードグリッド、メニュー項目に。8 項目を超えたら delay の伸びを頭打ちにしないと、最後の項目が待たされすぎます。"},"squash":{"title":"スカッシュ＆ストレッチ","desc":"着地の瞬間に潰れ、上昇時に伸びる。体積はほぼ保存されます。これがあると物体は剛体ではなく、質量を持った素材に見えます。","when":"マスコット、ゲーミフィケーション要素、ボタンの押下フィードバック（変形は 3% 以内に抑えること）。"},"followthrough":{"title":"フォロースルー","desc":"コンテナが先に止まり、中身は 60ms 遅れて止まります。差はごくわずかですが、取り除いた途端に動きが「硬く」なります。","when":"カードの展開、ドロワーのスライドなど、親子構造を持つトランジション全般に。"},"flip":{"title":"FLIP","desc":"First / Last / Invert / Play。移動前後の位置を計測し、transform で元の位置に「見せかけて」から解放します——レイアウトには一切触れずに、レイアウト変化のアニメーションが得られます。","when":"要素が DOM 上で実際に位置を変えるとき：並べ替え、カラム移動、コンテナへの出入り。レイアウトアニメーションの根幹技術です。"},"shared":{"title":"共有要素トランジション","desc":"同じオブジェクトが 2 つの画面の間を連続的に移動しながらサイズを変えます。ユーザーは「ページが変わった」ではなく「拡大された」と感じます。","when":"サムネイル → 詳細ページ、リスト項目 → フルスクリーンに。ネイティブアプリらしさの最大の源泉のひとつです。"},"viewtransition":{"title":"View Transitions API","desc":"ブラウザが新旧の画面をそれぞれスナップショットし、自動でクロスフェードします。view-transition-name を付けた要素は自動的にモーフします。いわばプラットフォーム組み込みの FLIP です。","when":"SPA のページ遷移や状態切り替えに。Chrome / Edge / Safari 18+ が対応。非対応ブラウザでは単にスキップされます。"},"reorder":{"title":"リスト並べ替え","desc":"順序が変わると、各項目が FLIP で旧位置から新位置へスライドします。このアニメーションがないと、ユーザーは見ていた行を完全に見失います。","when":"ソート切り替え、フィルタリング、ドラッグでの並べ替え、リアルタイムランキングに。"},"morphradius":{"title":"シェイプモーフ","desc":"border-radius の 8 つの値は独立に補間できます。SVG なしで、流れるような有機的シェイプが作れます。","when":"装飾的な背景シェイプ、アバターのコンテナ、ブランド感のあるブロブに。純粋な CSS で非常に低コストです。"},"accordion":{"title":"高さの自動展開","desc":"height: auto は補間できません。grid-template-rows を 0fr から 1fr へアニメーションさせれば動きます——現時点で最もクリーンな純 CSS の解法です。","when":"アコーディオン、「もっと見る」、折りたたみ式フォームに。scrollHeight を計測して px を書き込む古い手法の置き換えです。"},"reveal":{"title":"スクロールリビール","desc":"要素がビューポートに入ってから登場アニメーションを再生します。scroll イベントではなく IntersectionObserver を使うこと——こちらはブラウザがコンポジタースレッド側で判定するため、スクロールを遅くしません。","when":"長いページのコンテンツセクションやマーケティングページに。一度再生したら unobserve すること。行き来するたびに再生されるのは煩わしいものです。"},"parallax":{"title":"パララックス","desc":"深度の異なるレイヤーを異なる倍率で動かします。遠くはゆっくり、近くは速く——それだけで奥行きが生まれます。倍率差は 0.1–0.4 に収めること。大きすぎると酔います。","when":"ヒーローセクションやブランドストーリーページに。prefers-reduced-motion では必ず無効化を——最も乗り物酔いを誘発しやすい手法のひとつです。"},"scrollprog":{"title":"スクロール進捗","desc":"スクロール位置を 0–1 にマッピングし、任意の視覚プロパティを駆動します。アニメーションの「時間軸」が「位置軸」に置き換わり、再生はユーザーが完全に掌握します。","when":"長文の読了プログレス、章ナビゲーション、スクロールを再生ヘッドとして扱うナラティブページに。"},"sticky":{"title":"スティッキーシーン","desc":"ビジュアルを position: sticky で固定し、横のテキストはスクロールし続けます。見えているセクションに応じて固定側の状態を切り替える——スクロールが物語のメトロノームになります。","when":"プロダクト機能の解説、データストーリー、チュートリアルの手順に。スクロリーテリングの骨格です。"},"scrolltimeline":{"title":"スクロールタイムライン","desc":"CSS が @keyframes の時間軸をスクロール軸に直接差し替えます。JavaScript は一切不要で、コンポジタースレッド上で動くため、どれだけ速くスクロールしてもフレーム落ちしません。","when":"スクロールに連動するあらゆる表現に。scroll 連動 JS の大半を置き換えるネイティブ解で、非対応環境では静かに静的表示へフォールバックします。"},"typewriter":{"title":"タイプライター","desc":"steps() で幅を 1 文字分ずつジャンプさせ、点滅するカーソルを添えます。純 CSS 版は等幅フォントが前提で、幅は ch 単位で計算します。","when":"ターミナル風 UI、AI 応答のライブ感、トップページのキャッチコピーに。長文に使うと読者の忍耐が尽きます。"},"scramble":{"title":"テキストスクランブル","desc":"各文字がまずランダムに入れ替わり、順番に正しい文字へ「ロック」されていきます。左から右へロックすることで、解読の方向感が生まれます。","when":"テック感のある見出し、ロード完了の演出、パスワード／コード風の UI に。"},"splittext":{"title":"スプリットテキスト","desc":"テキストを 1 文字ずつ span に分割し、それぞれ遅延を付けて登場させます。分割時は空白と改行のセマンティクスを保つこと。さもないとスクリーンリーダーが文をバラバラの文字として読み上げます。","when":"見出しのリビール、ブランドのオープニングに。ラッパー要素の aria-label に必ず元の文を残し、支援技術に届けてください。"},"maskreveal":{"title":"マスクリビール","desc":"外側を overflow: hidden にし、内側の行を下から押し上げます。見えない一本の線の奥から文字が「生えてくる」ように見え、単純なフェードよりはるかに重みがあります。","when":"大見出し、章タイトル、映画的なオープニングに。行の高さに余裕を持たせないと、上端が切れます。"},"counter":{"title":"カウントアップ","desc":"数値を 0 から目標値まで補間します。終盤は ease-out で減速させること——等速で刻む数字は統計ではなく故障に見えます。","when":"ダッシュボード、スコア発表、クラウドファンディングの金額に。桁の幅を固定しないと行全体がガタつきます。"},"marquee":{"title":"無限マーキー","desc":"コンテンツを複製して 2 部にし、帯全体を -50% まで動かして瞬時に 0 へ戻します——2 部がまったく同じなので、継ぎ目は見えません。必ず linear を使います。","when":"ロゴウォール、お知らせバー、タグクラウドに。ホバーで一時停止するのは最低限のマナー——でないとユーザーは読めません。"},"varfont":{"title":"バリアブルフォント","desc":"バリアブルフォントのウェイトや字幅は連続した軸で、そのまま補間できます。かつては離散的なウェイトを切り替えるしかありませんでしたが、今は本当に「太っていく」ことができます。","when":"呼吸感のある見出し、ホバーフィードバック、太さで重みを符号化するデータビジュアライゼーションに。可変軸を持つシステムフォントか読み込みフォントが必要です。"},"kinetic":{"title":"キネティックタイポグラフィ","desc":"テキストそのものが主役です。サイズ・位置・リズムが意味に合わせて変化します。鍵は「拍」——各単語が留まる長さを、思い描いた語調に合わせること。","when":"オープニングアニメーション、ステートメントページ、動画のタイトルカードに。情報密度は低く、感情密度は高い場面向けです。"},"linedraw":{"title":"ラインドローイング","desc":"dasharray をパスの全長に設定し、dashoffset を全長から 0 までアニメーションさせます。破線の隙間がパス全体を「歩き切り」、線が描かれていくように見えます。","when":"ロゴのオープニング、チャート折れ線の登場、イラストの輪郭描画に。パスの長さは path.getTotalLength() で取得します。"},"pathfollow":{"title":"パス追従","desc":"offset-path が要素を任意の曲線に沿って進ませ、offset-rotate が自動で接線方向を向かせます。「弧」の原則の最も直接的な実装です。","when":"ナビゲーションのヒント、ゲーム的な経路、ローディング中の周回装飾に。純 CSS で、SVG アニメーションは不要です。"},"clipwipe":{"title":"クリップリビール","desc":"clip-path の circle() を、トリガー地点から半径 0 で全面を覆うまで展開します。Material Design の看板トランジションであり、View Transitions のカスタム効果としても最も定番です。","when":"ライト／ダークテーマの切り替え、ボタンから展開するフルスクリーンメニューに。円の中心はユーザーが直前にクリックした位置に置くこと。"},"checkmark":{"title":"チェックマーク描画","desc":"円を先に描き切り、チェックを後から描きます。2 つの間には 150ms のオーバーラップを。順序と重なりの量が、「確認」に見えるか「祝福」に見えるかを決めます。","when":"フォーム送信成功、決済完了、ToDo のチェックに。磨く価値が最も高いマイクロインタラクションのひとつです。"},"gradmask":{"title":"グラデーションマスク","desc":"グラデーションをマスクとして使い、それを動かします。境界は刃物で切ったようにではなく、柔らかくなります。clip-path より少し高コストですが、質感の差は歴然です。","when":"テキストの段階的な表示、画像のソフトなリビール、ストリーミング出力のフェードする尻尾に。"},"pathmorph":{"title":"パスモーフ","desc":"path の d 属性を直接補間します。前提として 2 つのシェイプのコマンド数と型が一致している必要があり、そうでなければ先に点の数を揃えます。","when":"アイコン間の変形（再生 ↔ 一時停止、メニュー ↔ 閉じる）、データグラフィックのシェイプ切り替えに。"},"magnetic":{"title":"マグネティックホバー","desc":"カーソルが範囲に入ると、要素がカーソル方向へ距離の一部（通常 30% ほど）だけ寄っていきます。ボタンが「押されたがっている」ように見えます。","when":"主要 CTA ボタン、ポートフォリオのインタラクティブ要素に。1 ページに 1〜2 個まで——画面中が磁石だらけではノイズになります。"},"trail":{"title":"カーソルトレイル","desc":"各ドットが線形補間でひとつ前を追いかけます：pos += (target - pos) * 0.3。係数が小さいほど粘りが増し、尾が長くなります。","when":"ポートフォリオや実験的サイトに。精密なポインタがあるときだけ有効化を（pointer: fine）——タッチデバイスにカーソルはありません。"},"inertia":{"title":"慣性（モメンタム）","desc":"指を離した瞬間の速度を記憶し、以降は毎フレーム摩擦係数（0.94 程度）を掛けながら、速度が知覚できなくなるまで滑り続けます。","when":"カスタムカルーセル、地図のパン、ドラッグ可能なキャンバスに。慣性のないドラッグは「指に貼り付いて剥がれない」感触になります。"},"rubber":{"title":"ラバーバンド","desc":"境界を越えると、変位が平方根のように圧縮されます——引くほど増分は減り、離すと弾き返されます。iOS で端までスクロールしたときの、あの手応えです。","when":"カスタムスクロールコンテナ、引き下げて閉じるドロワー、カルーセルの両端に。「まだ進めるのか」という問いに触覚で答えます。"},"particles":{"title":"パーティクル","desc":"それぞれ速度を持つ数百の点を、canvas 上で毎フレーム描き直します。DOM ではこの数は捌けません。動く要素が 60 個を超えたら canvas に切り替えるべきです。","when":"背景の雰囲気づくり、お祝いの紙吹雪、データ点のパーティクル化に。画面から離れたら cancelAnimationFrame を忘れずに——でないと背景がバッテリーを食い続けます。"},"ripple":{"title":"リップル","desc":"実際のタッチ地点から円が広がり、拡大しながらフェードアウトします。鍵は円の中心をクリック座標に置くこと。コンポーネントの中心ではありません——それでこそフィードバックです。","when":"ボタン、リスト項目、クリック可能な広い領域に。「受け取りました」を伝える最も安上がりな手段です。"},"tilt":{"title":"3D チルトカード","desc":"カーソル位置に応じて rotateX / rotateY を与え、同時にハイライトを逆方向へ走らせます。実体のある質感に見せる鍵はこのハイライトです。","when":"ポートフォリオカード、商品カード、会員カードに。角度は ±12° 以内に——超えると「立体」ではなく「歪み」になります。"},"cardflip":{"title":"カードフリップ","desc":"2 つの面を重ね、裏面をあらかじめ 180° 回転させておき、コンテナごと回します。backface-visibility: hidden がカメラに背を向けた面を隠します。","when":"記憶ゲーム、表裏の情報切り替え、統計カードの「詳細を見る」に。回転軸は X より Y が自然です。本のページはそう繰られるからです。"},"cube":{"title":"キューブ回転","desc":"6 つの面をそれぞれ回転させ、translateZ で辺の半分だけ押し出し、親に preserve-3d を指定します。CSS 3D の最も基本的な組み立て方です。","when":"ローディング、ロゴ、多面的なデータの切り替えに。モバイルでは注意——3D の合成レイヤーはメモリを大量に消費します。"},"layerdepth":{"title":"レイヤー視差","desc":"カーソルの動きに合わせ、深度の異なるレイヤーを異なる幅で逆方向にずらします。平面の画像から視点の変化を偽装する手法です。","when":"ヒーローイラスト、商品写真、カード内部のレイヤー表現に。ずらす量の配分は視覚的な遠近と一致させること。でないと違和感が出ます。"},"coverflow":{"title":"パースペクティブリスト","desc":"項目を Y 軸まわりに回転させて奥へ押し込み、弧状に並べます。深度差だけで「いまどれが選ばれているか」が伝わり、追加のマーカーは不要です。","when":"カバーブラウジング、カードピッカー、日付ホイールに。iOS ピッカーの視覚的な原型です。"},"shimmer":{"title":"スケルトンシマー","desc":"グレーのブロックの上を、斜めのハイライトが横切ります。目的は見た目の良さではなく、「ここは読み込み中で、空ではない」と宣言することです。","when":"データの読み込み中に。スケルトンの形は実際のコンテンツに近づけること。でないと表示時に醜いリフローが起きます。"},"gradflow":{"title":"グラデーションフロー","desc":"グラデーションをコンテナの何倍も大きく作り、background-position を動かします。動いている要素はひとつもないのに、面全体が呼吸しているように感じられます。","when":"ヒーロー背景、「AI 生成中」の状態、ブランドの雰囲気づくりに。速度はゆっくりと（8 秒以上）——速いと騒がしくなります。"},"glow":{"title":"グローパルス","desc":"box-shadow のぼかし半径と不透明度を同期して変化させます。リズムを意図的に人の呼吸（3〜4 秒に 1 回）へ近づけることで、不安ではなく静けさとして伝わります。","when":"録音中、AI が聞いている状態、待機中の音声アシスタントに。せわしない点滅は警告、ゆっくりした呼吸は待機です。"},"grain":{"title":"フィルムグレイン","desc":"SVG の feTurbulence でノイズレイヤーを生成して上に重ね、わずかに揺らします。デジタルなグラデーションは綺麗すぎる——粒子が加わって初めて実体感が出ます。","when":"エディトリアルなレイアウト、音楽・映像系プロダクトに。不透明度は 6–12% に抑えること。超えるとただ汚れて見えます。"},"glass":{"title":"グラスモーフィズム","desc":"backdrop-filter がぼかすのは要素の「背後」にあるものです。これが階層関係を作ります：ぼけている層が奥、鮮明な層が手前です。","when":"フローティングツールバー、モーダルの背景、iOS 風シートに。backdrop-filter は高コスト——スクロールする長いリストでは使わないこと。"},"goo":{"title":"グーイー（メタボール）","desc":"まずガウスぼかしをかけ、feColorMatrix で alpha のコントラストを極限まで引き上げます。ぼけた輪郭が硬い輪郭へ「切り戻され」、近づいたシェイプ同士がくっつきます。","when":"展開式のフローティングアクションボタン、有機的なローダー、ブランド装飾に。フィルターは高コストなので、適用範囲は小さいほど良いです。"},"glitch":{"title":"グリッチ","desc":"同じテキストを 3 層重ね、2 つの擬似要素を clip-path で異なる水平の帯に切って左右へずらし、切り方を高速で変化させます。","when":"ゲーム、音楽、ハッカー風のビジュアルに。必ず短く、まれに。長時間の明滅は不快なうえ、光過敏性反応を誘発しかねません。"},"chromatic":{"title":"色収差","desc":"赤とシアンのチャンネルを数ピクセルずつ逆方向にずらし、レンズ周辺部の色分散を模します。コストは軽く、雰囲気は濃厚です。","when":"見出しの微かなざわつき、ホバーフィードバック、レトロな CRT 質感に。ずらし量は 1–3px で十分です。"},"sprite":{"title":"スプライト／コマ送り","desc":"各コマを 1 列に並べ、steps() で位置を「滑らせる」のではなく「跳ばせ」ます。伝統的なセルアニメーションを CSS へ直訳したものです。","when":"ピクセルアート、手描きのコマ撮り、GIF の代替（ファイルが小さく再生も制御可能）に。コマ数と時間は割り切れる関係にすること。でないとガタつきます。"},"wave":{"title":"ウェーブグリッド","desc":"delay を座標の関数（例：(x+y) × 0.06s）にすると、要素の一面がバラバラに動くのではなく、波として広がっていきます。","when":"データグリッドのローディング、オーディオビジュアライザー、背景装飾に。「delay で方程式を書く」最も直感的な例です。"},"curtain":{"title":"カーテントランジション","desc":"複数の色パネルが順に画面を覆い、完全に隠れた瞬間にコンテンツを差し替え、また順に引いていきます。旧コンテンツがいつ消えたかは、幕の裏に完全に隠されます。","when":"ページ切り替え、章の区切りに。View Transitions が使えない環境で、遷移のちらつきを隠す最も確実な方法です。"},"dissolve":{"title":"ピクセルディゾルブ","desc":"画面をグリッドに切り分け、各セルをランダムな遅延でフェードアウトさせます。このランダム性が「アニメーション」らしさを消し、素材が崩壊していくように見せます。","when":"削除・破壊・データ消去のフィードバックに。「本当になくなった」という実感を、単純なフェードよりはるかに強く与えます。"},"liquidnav":{"title":"エラスティックインジケーター","desc":"インジケーターが移動の途中で横に伸び、到着すると元の形に戻ります。scaleX ひとつで、「フォロースルーとオーバーラップ」の原則を 2 点間の移動に適用しています。","when":"タブ、ボトムナビゲーション、セグメンテッドコントロールに。純粋に機能的なコンポーネントが個性を持てる、数少ない場所です。"},"orbit":{"title":"オービット","desc":"親が軌道を回し、子が逆回転して自転を打ち消すことで、オブジェクトは正面を向いたまま円周上を移動します。transform 合成の古典的な練習問題です。","when":"技術アーキテクチャ図、インテグレーションエコシステムの紹介、複数ノードのローディング表示に。"},"startingstyle":{"title":"@starting-style","desc":"要素が「画面に現れたその瞬間」の見た目を宣言します。従来、DOM に挿入されたばかりの要素には比較対象となる直前の状態がなく、transition は発火しませんでした。強制リフローでブラウザを騙すしかなかったのです。","when":"動的に挿入されるあらゆる要素に：トースト、ドロップダウン、読み込み直後のカード。CSS の登場アニメーションに十数年欠けていた、最大のピースです。"},"discrete":{"title":"allow-discrete","desc":"display のような「中間値を持たない」プロパティは、従来 transition に一切参加できませんでした。allow-discrete により、遷移の始点と終点で切り替わり、途中経過は他のプロパティが演じます。","when":"popover、<dialog>、display: none を出入りするものすべてに。@starting-style と合わせて三点セットにすれば、JS は class をひとつ toggle するだけで、両方向がアニメーションします。"},"autoheight":{"title":"calc-size()","desc":"interpolate-size: allow-keywords が、auto や min-content といったキーワードを補間可能な値に変えます。高さの展開に、scrollHeight を測って px を書き込む必要はもうありません。","when":"アコーディオン、「もっと見る」、チャットのメッセージスレッドに。本図鑑の「高さの自動展開」カード（grid-template-rows: 0fr→1fr）の置き換えですが、サポートが不十分な環境では旧手法が今も正解——サイト全体を急いで置き換えないこと。"},"linearspring":{"title":"linear() イージング","desc":"linear() はサンプル点の列で任意の曲線を記述します。cubic-bezier は制御点が 2 つで、オーバーシュートは最大 1 回。linear() は何度でも往復振動できます——つまりスプリングに、もう JavaScript は要りません。","when":"アニメーションライブラリを入れずに弾む個性が欲しいときに。3 つのプリセット名はそのままコピー可能——この語彙は SwiftUI の .smooth / .snappy / .bouncy にそのまま対応します。"},"propgradient":{"title":"@property","desc":"型を登録していないカスタムプロパティは、ブラウザにとってただの文字列で、アニメーション中は 50% 地点で一気に飛びます。@property で syntax を宣言して初めて、本物の角度・色・長さになります。","when":"グラデーションの回転、カラーストップ、あらゆる「本来補間できなかった」ものに。左は登録済み、右は未登録——違いは一目瞭然です。"},"multitrack":{"title":"マルチトラックキーフレーム","desc":"ひとつの @keyframes 内のプロパティは、すべて同じタイムラインを共有します。回転と移動に別々のリズムを与えたければ、CSS では要素を入れ子にして分けるしかありません——複数の animation が同時に transform を書くと、互いに上書きし合うからです。","when":"有機的な持続モーション、マスコット、複合的なローディングに。SwiftUI の KeyframeAnimator は KeyframeTrack でこれをネイティブにサポートしており、CSS が本当に苦しむ数少ない領域です。"},"vt-custom":{"title":"old / new のカスタマイズ","desc":"デフォルトのトランジションは旧画面のフェードアウトと新画面のフェードインだけです。::view-transition-old() と -new() に別々のアニメーションを与えれば、旧は左へ退き、新は右から入ってきます。","when":"タブ切り替え、ステップフロー、方向感のあるコンテンツ差し替えに。ネイティブトランジションを「使える」から「良い」へ引き上げる最初の一歩です。"},"vt-group":{"title":"::view-transition-group()","desc":"同名要素間の位置とサイズの変化は group 層が担います。ここに animation-duration とイージングを指定すれば、モーフの速さやオーバーシュートの有無を決められます。","when":"共有要素トランジションに個性が欲しいときに。新旧コンテンツのフェードは old/new が、シェイプの飛び方は group が担当——別々に調整できます。"},"vt-types":{"title":"Transition Types","desc":"startViewTransition には types を渡せ、CSS 側は :active-view-transition-type() で受け取ります。同じ要素群でも、進むときと戻るときで正反対のアニメーションを再生できます。","when":"前後関係のあるナビゲーションに：ページネーション、ウィザードフロー、閲覧履歴。方向感のないトランジションは、ユーザーから「いまどこにいるか」の感覚を奪います。"},"vt-clash":{"title":"名前の衝突","desc":"同じ view-transition-name を持つ要素が同時に 2 つ存在すると、トランジション全体が丸ごとスキップされます——画面は瞬時に切り替わり、コンソールは沈黙したままです。左は一意な命名、右は重複あり。クリックして違いを確かめてください。","when":"このカードはデバッグ用です。トランジションが「動かないのにエラーも出ない」とき、最初に疑うべきは名前の衝突——特にコンポーネントが繰り返しレンダリングされるリストで。"},"vt-list":{"title":"リストから詳細へ","desc":"クリックされた項目のサムネイルとタイトルに view-transition-name を一時的に付与し、トランジション終了後に外します。名前は必要な一瞬しか存在しないため、リスト内の他の項目と衝突しません。","when":"リスト → 詳細、商品 → 商品ページ、アルバム → 拡大画像に。ネイティブアプリらしさの最大の源泉で、フレームワークは一切不要です。"},"vt-mpa":{"title":"クロスドキュメント遷移","desc":"@view-transition { navigation: auto } の 1 行で、同一オリジンの「本物のページ遷移」にもトランジションが付きます。下の iframe の中身は独立した 2 つの .html——フレームワークも SPA ルーターもありません。","when":"ブログ、ドキュメントサイト、EC など、あらゆるマルチページサイトに。かつてアプリ級のトランジションにはサイト全体の SPA 化が必要でした。もう要りません。"}},"laws":[{"title":"スカッシュ＆ストレッチ Squash & Stretch","desc":"ボタンは押されると少し潰れ、離すと弾んで戻る。体積を保った変形が、コンポーネントにステッカーではなく素材と重さを与えます。"},{"title":"予備動作 Anticipation","desc":"メニューは開く前に逆方向へ少し縮む。「何かが起きる」という予告を目に与えることで、続く本動作が意図的なものとして伝わります。"},{"title":"演出 Staging","desc":"主役は一度にひとつだけ。3 つが同時に動くのは、何も動いていないのと同じ——視線の置き場がなくなります。"},{"title":"ポーズ・トゥ・ポーズ Pose to Pose","desc":"インターフェースはほぼすべて pose to pose です。状態 A と状態 B を定義し、間は補間に任せる。CSS transition はまさにこの思想です。"},{"title":"フォロースルー Follow Through","desc":"カードが止まり、中のテキストは 40–80ms 遅れて止まる。物体は一斉に整然とブレーキをかけません——このズレが生命感を生みます。"},{"title":"スローイン・スローアウト Slow In & Out","desc":"現実に等速運動はありません。<code>linear</code> は無限回転のローディングとマーキーだけに取っておき、それ以外はすべて ease を使います。"},{"title":"弧 Arc","desc":"自然な運動は曲線を描きます。直線移動は機械的に見えます。<code>offset-path</code> か、X と Y に別々のイージングを与えて弧を作りましょう。"},{"title":"副次アクション Secondary Action","desc":"本動作に添える小さなディテール：カードが浮き上がるとき、影も同時に濃く、柔らかく広がる。主役を強化するものであり、主役を食ってはいけません。"},{"title":"タイミング Timing","desc":"時間の長さは重さです。同じ移動でも 300ms なら軽快、800ms なら鈍重。個性を変えるには、曲線より時間を変える方が効きます。"},{"title":"誇張 Exaggeration","desc":"目標を通り過ぎてから戻る方が、ぴったり止まるより説得力があります。オーバーシュート曲線 <code>cubic-bezier(.34,1.56,.64,1)</code> はこの原則そのものです。"},{"title":"立体感 Solid Drawing","desc":"3D トランジションには必ず <code>perspective</code> を。ないと反転は厚みのある物体ではなく、押し潰された紙切れに見えます。"},{"title":"アピール Appeal","desc":"モーションはプロダクトの訛りです。サイト全体でイージングと時間の階梯を共有して初めて、ユーザーは「このアプリには個性がある」と感じます。"}],"rules":[{"title":"動かすのは transform と opacity だけ","desc":"この 2 つは GPU 合成に完全に任せられます。<code>width/top/margin</code> を動かすと layout が発生し、60fps は即座に崩壊します。"},{"title":"退場は常に登場より速く","desc":"よくある比率は 2:1。登場は招待、退場は道を譲ること——閉じたはずのものを待ちたい人はいません。"},{"title":"中断できること","desc":"ユーザーが途中で気を変えたら、アニメーションは現在の状態から続行すべきで、再生し終えてから反応してはいけません。これは CSS より Web Animations API の方が扱いやすい領域です。"},{"title":"reduced-motion を尊重する","desc":"前庭感覚が敏感な人は、視差や大きな移動で目まいを起こします。<code>@media (prefers-reduced-motion:reduce)</code> で単純なフェードへ格下げを——モーションを丸ごと切らないこと。"},{"title":"モーションは状態の説明","desc":"良いモーションは「これはどこから来て、どこへ行くのか」に答えています。答えられないモーションは装飾であり、削るべきです。"},{"title":"一貫性は華やかさに勝る","desc":"サイト全体でイージング 3 本、時間 4 段階あれば十分です。コンポーネントごとに独自曲線を作るのは、デザインシステムがないのと同じです。"}],"other":[{"title":"KeyframeAnimator のマルチトラック","desc":"プロパティごとに独立したタイムラインを持てます。CSS は 1 つの <code>@keyframes</code> にすべてのプロパティが縛られ、分けるには要素の入れ子しかありません。"},{"title":"PhaseAnimator のフェーズ列","desc":"離散的なフェーズの列で駆動し、切り替わるたびに自動で補間します。Web では自前のステートマシンを書いて class を切り替えることになります。"},{"title":"scrollTransition の phase","desc":"<code>.topLeading</code> / <code>.identity</code> / <code>.bottomTrailing</code> の 3 段階モデル。IntersectionObserver の「入ったか否か」よりはるかにきめ細かい仕組みです。"},{"title":".symbolEffect()","desc":"SF Symbols には bounce / pulse / variableColor / replace が組み込まれています。Web には「アイコンが自前のアニメーションを持つ」という概念自体がありません。"},{"title":"セマンティックな spring プリセット","desc":"<code>.smooth</code> / <code>.snappy</code> / <code>.bouncy</code> は物理パラメータをデザイン語彙に包んだもの。CSS は <code>linear()</code> で近似するしかなく、共通の命名もありません。"},{"title":".contentTransition(.numericText())","desc":"システムレベルの数字ロールです。本図鑑の「カウントアップ」カードは rAF で手作りしています。"},{"title":".sensoryFeedback の触覚同期","desc":"モーションデザインの第 4 の次元です。Web には貧弱な Vibration API しかなく、デスクトップには存在すらしません。"},{"title":"Liquid Glass","desc":"<code>GlassEffectContainer</code> + <code>glassEffectID</code>（iOS 26）はシステムレベルの液体ガラスです。インタラクティブで、ジェスチャーに応じて屈折し、モーフまでします。本図鑑の「グーイー（メタボール）」は SVG フィルターで見た目を模しているだけです。"},{"title":"Hero","desc":"2 つのルートのコンポーネントに同じ tag を付ければ、共有要素トランジションは完成です。Web では FLIP を手書きするか、普及途上の View Transitions を使うことになります。"},{"title":"Curves ファミリー全種","desc":"40 本以上の名前付き曲線（<code>easeOutBack</code>、<code>elasticIn</code>、<code>bounceOut</code>…）。cubic-bezier の 4 つの数字を暗記する必要はありません。"},{"title":"Impeller のシェーダー事前ウォームアップ","desc":"<code>.frag</code> はコンパイル時にビルド済み。Web のようにシェーダーの初回実行で引っかかることがありません。"}],"cross":[{"concept":"イージング曲線","flutter":"<code>Curves.easeOutCubic</code>（組み込みの名前付き曲線 40 本以上）","swiftui":"<code>.easeOut</code>、またはセマンティックな <code>.smooth</code> / <code>.snappy</code> / <code>.bouncy</code>"},{"concept":"キーフレーム","css":"<code>@keyframes</code>（全プロパティが 1 本のタイムラインを共有）","swiftui":"<code>KeyframeAnimator</code>（プロパティごとに <code>KeyframeTrack</code> 1 本）"},{"concept":"状態変化の自動補間"},{"concept":"再生の手動制御","flutter":"<code>AnimationController</code>（explicit——<code>dispose</code> を忘れずに）","swiftui":"<code>withAnimation</code> + 独自の状態"},{"concept":"共有要素トランジション","css":"FLIP の手書き / View Transitions API","flutter":"<code>Hero</code>（同じ tag を付けるだけ——ほぼタダ）"},{"concept":"スプリング物理","css":"<code>linear()</code> による近似 / JS の毎フレームシミュレーション"},{"concept":"スタガー","flutter":"単一の controller を <code>Interval</code> で分割"},{"concept":"スクロール連動","swiftui":"<code>scrollTransition</code>（3 段階の phase）"},{"concept":"マテリアルブラー"},{"concept":"カスタム描画"},{"concept":"シェーダー / フィルター"},{"concept":"ページトランジション","swiftui":"NavigationStack のトランジション、<code>.zoom</code>"},{"concept":"中断可能なジェスチャー遷移","css":"すべて手書き","flutter":"ジェスチャーと controller を自分で接続","swiftui":"システム組み込み——iOS の看板機能"}],"duration":[{"when":"hover / 押下フィードバック","why":"ポインタに追従している感覚が必須です。200ms を超えると「引っかかり」として知覚されます。"},{"when":"小さな UI の開閉<br>（ツールチップ、ドロップダウン）","curve":"入り <code>ease-out</code><br>出 <code>ease-in</code>","why":"登場は即座に見えてほしいので速く始めて減速。退場はもう関心の外なので、ゆっくり始めて素早く退きます。"},{"when":"カード展開 / ドロワー / モーダル","why":"面積も移動も大きく、空間関係を伝えるための時間が必要です。"},{"when":"ページ遷移","why":"両端が遅く中間が速い——カット割りではなく、カメラの移動のように感じられます。"},{"when":"大きなオブジェクトの移動 / ドラッグのリリース","curve":"剛性 0.08 / 減衰 0.75","why":"慣性を持つものに固定の時間は不釣り合いです。物理シミュレーションの方が duration より正直です。"},{"when":"ローディング / マーキー","why":"無限ループにイージングを付けると継ぎ目に「心拍」が生まれ、かえって滑らかさを失います。"},{"when":"リスト項目の順次登場","dur":"1 項目あたり delay 30–60ms","why":"間隔が広すぎると最後の項目が待たされすぎます。8 項目を超えたらバッチ化するか、単一のグループアニメーションに切り替えを。"}]},"ko":{"ui":{"heroTitle":"애니메이션 표현 기법 <em>도감</em>","lede":"가장 흔한 페이드·이동부터 FLIP, 스크롤 타임라인, 구이(gooey) 블롭, 글리치 아트 같은 흔치 않은 기법까지. 모든 카드는 <strong>실제로 움직이는</strong> 구현이며, 언제 쓰면 좋은지에 대한 메모와 그대로 복사해 갈 수 있는 핵심 코드가 함께 담겨 있습니다.","searchPh":"기법·키워드 검색…","fwLab":"프롬프트 대상","fwTitle":"프롬프트를 복사할 때 어떤 프레임워크 버전으로 생성할지 선택","copyAll":"전체 복사 ({n})","replayAll":"전체 다시 재생","motionOff":"모션 일시정지","motionOn":"모션 재개","themeTitle":"라이트/다크 테마 전환","langBtn":"한국어","langTitle":"언어","all":"전체","empty":"일치하는 기법이 없습니다.","s01n":"01","s01h":"기법 도감","s01d":"위의 카테고리나 검색으로 필터링하세요. 카드에 마우스를 올리거나 「다시 재생」을 누르면 다시 볼 수 있습니다. 일부 기법은 호버·클릭·드래그로만 트리거되며, 어떤 방식인지는 태그에 표시되어 있습니다.","viewCode":"코드 보기","replay":"↻ 다시 재생","copyPrompt":"⧉ 프롬프트 복사","copied":"복사됨 ✓","copyFail":"복사 실패","copyfallMsg":"브라우저가 자동 복사를 차단했습니다(대개 창에 포커스가 없거나 file:// 로 연 경우입니다). 아래 텍스트가 이미 전체 선택되어 있으니 ⌘C / Ctrl+C 를 누르세요.","copyfallClose":"닫기","rmNotice":"시스템의 「동작 줄이기」 설정이 감지되어 모든 데모 애니메이션을 자동으로 일시정지했습니다.","rmResume":"그래도 보기","footer":"단일 HTML 파일, 의존성 제로, 전부 네이티브 CSS / Web Animations API / Canvas.<br><b>각 카드에 실린 코드는 이 페이지에서 실제로 실행 중인 코드 그대로</b>이니 바로 복사해서 쓸 수 있습니다.","s02n":"02","s02h":"애니메이션 12원칙 → 인터페이스 대응","s02d":"1930년대 디즈니가 정리한 애니메이션 12원칙은 모든 모션 표현의 밑바탕이 되는 문법입니다. 향수가 아니라, 인터페이스 어휘로 옮기면 지금도 전부 유효합니다.","s03n":"03","s03h":"크로스 플랫폼 대조표","s03d":"같은 표현이 세 플랫폼에서 각각 어떤 이름으로 불리는지 정리했습니다. API를 찾아보기 위한 표가 아니라, CSS 방식을 Flutter에 그대로 직역하는 일을 막기 위한 표입니다. 플랫폼마다 더 자연스러운 길이 따로 있습니다.","s04n":"04","s04h":"다른 플랫폼 고유의 표현 기법","s04d":"웹에는 대응물이 없는 기법들입니다. 아직 안 만들어진 게 아니라 멘털 모델 자체가 다르기 때문입니다. 크로스 플랫폼 제품을 만들 때 내가 무엇을 잃고 무엇을 얻는지 알아 둘 가치가 있습니다.","s05n":"05","s05h":"지속 시간·커브 치트시트","s05d":"몇 밀리초로 잡아야 할지 모를 때는 먼저 이 표를 그대로 베끼고, 실제 느낌에 따라 미세 조정하세요. 원칙: 등장은 빠르게, 퇴장은 더 빠르게. 거리가 멀수록 시간은 길어지되 증가폭은 선형보다 완만하게.","durTh":["상황","권장 시간","커브","이유"],"crossTh":["개념","CSS / Web","Flutter","SwiftUI"],"docTitle":"모션 디자인 도감 — Motion Design Field Guide","linkTitle":"이 카드 링크 복사"},"trig":{"auto":"자동 재생","hover":"호버","click":"클릭","drag":"드래그","scroll":"스크롤"},"cats":{"basic":"기본 변화","timing":"타이밍과 이징","layout":"레이아웃 전환","scroll":"스크롤 연동","text":"텍스트 애니메이션","svg":"드로잉과 마스크","physics":"물리와 인터랙션","depth":"공간과 3D","surface":"빛과 질감","special":"실험적 기법","modern":"모던 CSS 전환","vt":"View Transitions"},"demos":{"fade":{"title":"페이드","desc":"opacity만 움직입니다. 가장 저렴하고 가장 실패하지 않는 선택지이며, 다른 모든 기법이 최종적으로 폴백하는 종착점입니다.","when":"공간 관계를 설명할 필요가 없는 콘텐츠 교체에 적합합니다. 단독으로 쓰면 다소 밋밋해서 보통 작은 이동과 함께 씁니다."},"rise":{"title":"페이드 업","desc":"opacity에 8–24px의 이동을 더한 것입니다. 이동량은 작게 유지해야 합니다 — 크면 ‘떠오르는’ 게 아니라 ‘날아드는’ 것처럼 보입니다.","when":"거의 모든 콘텐츠 등장의 기본값입니다: 리스트, 카드, 섹션 제목."},"pop":{"title":"스케일 팝","desc":"0.85에서 1로, 오버슈트 커브와 함께 확대합니다. 시작값을 0으로 두지 마세요 — ‘팝’이 아니라 ‘무에서 생겨나는’ 느낌이 됩니다.","when":"모달, 툴팁, 알림, 좋아요 버튼. 주의를 끌어야 하는 작은 컴포넌트에 씁니다."},"spin":{"title":"스핀","desc":"무한 회전은 linear가 정답인 몇 안 되는 경우입니다. ease를 넣으면 바퀴를 돌 때마다 한 번씩 ‘턱’ 걸려 오히려 매끄럽지 않게 보입니다.","when":"얼마나 기다릴지 모르는 로딩에 씁니다. 진행률을 알 수 있다면 진행 바를 쓰세요 — 스피너는 ‘아직 살아 있다’는 뜻일 뿐입니다."},"blurin":{"title":"블러 인","desc":"filter: blur(12px)가 0으로 수렴하며 렌즈가 초점을 맞추는 느낌을 냅니다. 시각적 무게감이 크지만, blur는 비용이 큰 필터입니다.","when":"히어로 비주얼, 이미지 로드 완료 시점. 한 화면에 하나만 쓰고 긴 리스트에는 절대 넣지 않습니다."},"flipin":{"title":"플립 인","desc":"X축을 따라 뒤집히며 들어옵니다. 부모에 perspective가 있어야 하며, 없으면 그저 세로로 눌리는 것처럼 보입니다.","when":"데이터 카드, 통계 수치 갱신, 카드 뒤집기식 콘텐츠 교체."},"wipein":{"title":"방향 와이프","desc":"clip-path의 inset을 점진적으로 열고 콘텐츠 자체는 전혀 움직이지 않습니다. opacity만 쓸 때보다 훨씬 ‘드러나는’ 의식감이 있습니다.","when":"이미지 등장, 헤드라인 리빌, 탭 콘텐츠 전환. 방향은 사용자의 읽기 흐름과 일치시킵니다."},"easing":{"title":"이징 비교","desc":"같은 거리, 같은 시간 — 커브만 바꿉니다. 개성의 차이는 거의 전부 이동량이 아니라 이 곡선에서 나옵니다.","when":"디자인 시스템의 이징 단계를 정할 때 후보 커브를 나란히 돌려 보세요. 숫자를 읽는 것보다 훨씬 정확합니다."},"spring":{"title":"스프링","desc":"duration 없이 강성과 감쇠만 설정하고 매 프레임 속도를 다시 계산합니다. 목표가 도중에 바뀌어도 자연스럽게 이어집니다.","when":"드래그 후 릴리스, 제스처 기반 인터랙션 등 사용자가 도중에 마음을 바꿀 수 있는 모든 상호작용."},"overshoot":{"title":"오버슈트","desc":"cubic-bezier의 y값이 1을 넘으면 목표를 지나쳤다가 되돌아와 안착합니다. 윗줄은 정확히 착지, 아랫줄은 오버슈트입니다.","when":"‘탱탱한’ 개성이 필요한 컴포넌트에 씁니다. 텍스트 레이아웃에는 피하세요 — 글자가 흔들리면 읽기 어렵습니다."},"anticipation":{"title":"예비 동작","desc":"본동작 전에 반대 방향으로 살짝 움츠립니다. 윗줄은 바로 출발하고 아랫줄은 먼저 힘을 모읍니다 — 아랫줄이 ‘의도가 있어’ 보입니다.","when":"중요한 일회성 전환에 씁니다. 리스트 항목에는 쓰지 마세요 — 너무 자주 반복되면 수선스러워집니다."},"stagger":{"title":"스태거","desc":"같은 애니메이션을 항목마다 한 박자씩 늦게 시작합니다. 40ms 안팎이 가장 편안하며, 크면 늘어지고 작으면 동시에 움직이는 것과 다르지 않습니다.","when":"리스트, 카드 그리드, 메뉴 항목. 8개를 넘으면 delay 증가를 눌러 주세요 — 아니면 마지막 항목이 한없이 기다립니다."},"squash":{"title":"스쿼시 & 스트레치","desc":"착지 순간 눌리고 상승할 때 늘어나며 부피는 대략 보존됩니다. 물체를 강체가 아니라 질감 있는 물체로 보이게 하는 원칙입니다.","when":"마스코트, 게이미피케이션 요소, 버튼 프레스 피드백(변형량은 3% 이내로)."},"followthrough":{"title":"팔로 스루","desc":"컨테이너가 먼저 멈추고 내용물은 60ms 늦게 멈춥니다. 차이는 미묘하지만, 빼는 순간 화면이 곧바로 ‘뻣뻣해’집니다.","when":"카드 확장, 드로어 슬라이드 등 부모/자식 구조가 있는 모든 전환."},"flip":{"title":"FLIP","desc":"First / Last / Invert / Play. 이동 전후의 위치를 측정하고 transform으로 원래 자리에 ‘있는 척’ 되돌린 뒤 재생합니다 — 레이아웃을 전혀 건드리지 않고 레이아웃 변화 애니메이션을 얻습니다.","when":"요소가 DOM에서 실제로 자리를 옮길 때: 재정렬, 열 이동, 컨테이너 진입·이탈. 레이아웃 애니메이션의 뿌리가 되는 기법입니다."},"shared":{"title":"공유 요소 전환","desc":"같은 오브젝트가 두 화면 사이를 끊김 없이 이동하며 크기를 바꿉니다. 사용자는 ‘페이지가 바뀌었다’가 아니라 ‘커졌다’고 느낍니다.","when":"섬네일 → 상세 페이지, 리스트 항목 → 전체 화면. ‘네이티브 앱 느낌’의 가장 큰 원천 중 하나입니다."},"viewtransition":{"title":"View Transitions API","desc":"브라우저가 이전·이후 화면을 각각 스냅샷으로 찍어 자동으로 크로스페이드하고, view-transition-name이 붙은 요소는 자동으로 모핑됩니다. 사실상 플랫폼에 내장된 FLIP입니다.","when":"SPA 내비게이션, 상태 전환. Chrome / Edge / Safari 18+에서 지원되며, 미지원 브라우저에서는 그냥 건너뜁니다."},"reorder":{"title":"리스트 재정렬","desc":"순서가 바뀌면 각 항목이 FLIP으로 이전 위치에서 새 위치로 미끄러집니다. 이 애니메이션이 없으면 사용자는 보고 있던 행을 완전히 놓칩니다.","when":"정렬 토글, 필터링, 드래그 정렬, 실시간 리더보드."},"morphradius":{"title":"셰이프 모프","desc":"border-radius의 여덟 값은 각각 독립적으로 트위닝할 수 있어, SVG 없이도 흐르는 유기적 형태를 만들 수 있습니다.","when":"장식용 배경 도형, 아바타 컨테이너, 브랜드 느낌의 블롭. 순수 CSS라 비용이 매우 낮습니다."},"accordion":{"title":"높이 자동 확장","desc":"height: auto는 트위닝할 수 없습니다. grid-template-rows를 0fr에서 1fr로 움직이면 동작합니다 — 현재 가장 깔끔한 순수 CSS 해법입니다.","when":"아코디언, ‘더 보기’, 접히는 폼 섹션. scrollHeight를 재서 px로 박아 넣던 오래된 방식을 대체합니다."},"reveal":{"title":"스크롤 리빌","desc":"요소가 뷰포트에 들어와야 등장 애니메이션이 재생됩니다. scroll 이벤트가 아니라 IntersectionObserver를 쓰세요 — 후자는 브라우저가 컴포지터 스레드에서 판정하므로 스크롤을 느리게 만들지 않습니다.","when":"긴 페이지의 콘텐츠 섹션, 마케팅 페이지. 한 번 재생한 뒤 unobserve 하세요 — 오갈 때마다 다시 재생되면 거슬립니다."},"parallax":{"title":"패럴랙스","desc":"깊이가 다른 레이어를 서로 다른 배율로 움직입니다 — 먼 것은 느리게, 가까운 것은 빠르게 — 그렇게 깊이감을 위조합니다. 배율 차는 0.1–0.4 사이로 유지하세요. 그보다 크면 어지럼증을 유발합니다.","when":"히어로 섹션, 브랜드 스토리 페이지. prefers-reduced-motion에서는 반드시 끄세요 — 멀미를 가장 잘 일으키는 기법 중 하나입니다."},"scrollprog":{"title":"스크롤 진행률","desc":"스크롤 위치를 0–1로 매핑해 어떤 시각 속성이든 구동합니다. 애니메이션의 ‘시간축’이 사용자가 완전히 제어하는 ‘위치축’으로 바뀝니다.","when":"장문 읽기 진행률, 챕터 내비게이션, 스크롤을 재생 헤드로 삼는 내러티브 페이지."},"sticky":{"title":"스티키 씬","desc":"비주얼은 position: sticky로 고정되고 옆의 텍스트는 계속 스크롤됩니다. 어느 구간이 보이느냐에 따라 고정된 화면의 상태가 전환됩니다. 스크롤이 내러티브의 메트로놈이 됩니다.","when":"제품 기능 소개, 데이터 스토리, 튜토리얼 단계. 스크롤리텔링의 뼈대입니다."},"scrolltimeline":{"title":"스크롤 타임라인","desc":"CSS가 @keyframes의 타임라인을 스크롤 축으로 직접 교체합니다 — JavaScript 제로에, 컴포지터 스레드에서 실행되므로 아무리 빨리 스크롤해도 프레임이 떨어지지 않습니다.","when":"스크롤 위치에 묶이는 모든 비주얼. 대부분의 scroll-linked JS를 대체하는 네이티브 해법이며, 미지원 환경에서는 조용히 정적 상태로 폴백합니다."},"typewriter":{"title":"타자기 효과","desc":"steps()로 너비를 한 칸씩 튀게 하고 깜빡이는 캐럿을 곁들입니다. 순수 CSS 버전은 고정폭 글꼴이 필요하며 너비는 ch 단위로 계산합니다.","when":"터미널 UI, 실시간 AI 응답 같은 느낌, 홈페이지 태그라인. 긴 글에 쓰면 사람들이 인내심을 잃습니다."},"scramble":{"title":"텍스트 스크램블","desc":"각 문자가 먼저 무작위로 뒤바뀌다가 순서대로 올바른 글자로 ‘고정’됩니다. 왼쪽에서 오른쪽으로 고정해야 해독되는 방향감이 생깁니다.","when":"테크 느낌의 헤드라인, ‘로딩 완료’ 연출, 비밀번호·코드류 UI."},"splittext":{"title":"스플릿 텍스트","desc":"텍스트를 span 단위로 쪼개 각각 다른 delay로 등장시킵니다. 쪼갤 때 공백과 줄바꿈 의미를 보존하지 않으면 스크린 리더가 문장을 흩어진 낱글자로 읽습니다.","when":"헤드라인 리빌, 브랜드 인트로. 보조 기술을 위해 래퍼에 aria-label로 원문을 반드시 남겨 두세요."},"maskreveal":{"title":"마스크 리빌","desc":"overflow: hidden 래퍼 안에서 줄 전체가 아래에서 위로 밀려 올라옵니다. 글자가 보이지 않는 선 뒤에서 ‘자라나는’ 듯 보여 단순 페이드보다 훨씬 무게감이 있습니다.","when":"큰 헤드라인, 챕터 제목, 영화 같은 오프닝. line-height를 충분히 주지 않으면 윗부분이 잘립니다."},"counter":{"title":"숫자 카운터","desc":"값이 0에서 목표까지 트위닝되며, 끝부분은 ease-out으로 느려져야 합니다 — 등속으로 튀는 숫자는 통계가 아니라 고장처럼 보입니다.","when":"대시보드, 점수 공개, 펀딩 금액. 숫자 폭을 고정하지 않으면 줄 전체가 떨립니다."},"marquee":{"title":"무한 마퀴","desc":"콘텐츠를 두 벌 복제해 전체 스트립을 -50%까지 움직였다가 순간적으로 0으로 되돌립니다 — 두 벌이 완전히 같아서 이음새가 전혀 보이지 않습니다. 반드시 linear를 씁니다.","when":"로고 월, 공지 바, 태그 클라우드. hover 시 일시정지는 기본 예의입니다 — 그러지 않으면 사용자가 아예 읽을 수 없습니다."},"varfont":{"title":"가변 폰트","desc":"가변 폰트의 굵기와 폭은 연속 축이라 직접 트위닝할 수 있습니다. 예전에는 몇 개의 이산 굵기 사이를 딱딱 끊어 바꿀 수밖에 없었지만, 이제는 정말로 ‘살이 붙는’ 연출이 가능합니다.","when":"숨 쉬는 듯한 헤드라인, 호버 피드백, 굵기로 인코딩한 데이터 시각화. 가변 축을 지원하는 시스템 폰트 또는 로드된 폰트가 필요합니다."},"kinetic":{"title":"키네틱 타이포그래피","desc":"텍스트 자체가 주인공입니다: 크기·위치·리듬이 의미에 따라 변합니다. 핵심은 ‘박자’ — 각 단어가 머무는 길이가 상상 속 어조와 맞아떨어져야 합니다.","when":"오프닝 타이틀, 선언문 페이지, 영상 타이틀 카드. 정보 밀도는 낮고 감정 밀도는 높은 자리에 씁니다."},"linedraw":{"title":"라인 드로잉","desc":"dasharray를 패스 전체 길이로 설정한 뒤 dashoffset을 그 길이에서 0까지 애니메이션하면, 대시의 틈이 패스를 ‘걸어가며’ 선이 그려지는 것처럼 보입니다.","when":"로고 인트로, 차트 선 등장, 일러스트 외곽선. 패스 길이는 path.getTotalLength()로 얻습니다."},"pathfollow":{"title":"패스 팔로우","desc":"offset-path는 요소를 임의의 곡선을 따라 이동시키고, offset-rotate는 자동으로 접선 방향을 바라보게 합니다. ‘호(Arc) 원칙’의 가장 직접적인 구현입니다.","when":"내비게이션 힌트, 게임화된 경로, 로딩 중 도는 장식. 순수 CSS이며 SVG 애니메이션이 필요 없습니다."},"clipwipe":{"title":"클립 리빌","desc":"clip-path의 circle()이 트리거 지점에서 반지름 0으로 시작해 전체를 덮을 때까지 확장됩니다. Material Design의 시그니처 전환이자, View Transitions에서 가장 흔한 커스텀 효과입니다.","when":"라이트/다크 테마 전환, 버튼에서 펼쳐지는 전체 화면 메뉴. 원의 중심은 사용자가 방금 클릭한 지점에 두세요."},"checkmark":{"title":"체크마크 드로잉","desc":"원이 먼저 그려지고 체크가 뒤따르며, 둘 사이에 150ms의 겹침이 있습니다. 순서와 겹침 정도가 ‘확인’으로 읽힐지 ‘축하’로 읽힐지를 결정합니다.","when":"폼 제출 성공, 결제 완료, 할 일 체크. 공들여 다듬을 가치가 가장 큰 마이크로 인터랙션 중 하나입니다."},"gradmask":{"title":"그레이디언트 마스크","desc":"그레이디언트를 움직이는 마스크로 사용해 칼로 자른 듯한 경계 대신 부드러운 가장자리를 만듭니다. clip-path보다 조금 비싸지만 질감 차이가 큽니다.","when":"텍스트의 구간별 표시, 이미지의 부드러운 리빌, 스트리밍 출력의 흐려지는 꼬리."},"pathmorph":{"title":"패스 모프","desc":"path의 d 속성을 직접 트위닝합니다. 두 도형의 명령 개수와 타입이 일치해야 하며, 아니라면 먼저 점 개수를 맞춰야 합니다.","when":"아이콘 전환(재생 ↔ 일시정지, 메뉴 ↔ 닫기), 데이터 그래픽의 형태 전환."},"magnetic":{"title":"마그네틱 호버","desc":"커서가 범위에 들어오면 요소가 커서 쪽으로 거리의 일부(보통 30% 정도)만큼 끌려갑니다. 버튼이 ‘눌리고 싶어 하는’ 것처럼 보이게 합니다.","when":"주요 CTA 버튼, 포트폴리오의 인터랙티브 요소. 페이지당 한두 개까지만 — 화면 가득한 마그네틱은 소음이 됩니다."},"trail":{"title":"커서 트레일","desc":"각 점이 앞의 점을 선형 보간으로 쫓아갑니다: pos += (target - pos) * 0.3. 계수가 작을수록 더 끈적하고 길게 끌립니다.","when":"포트폴리오, 실험적인 사이트. 정밀 포인터가 있을 때만(pointer: fine) 켜세요 — 터치 기기에는 커서가 없습니다."},"inertia":{"title":"관성 / 모멘텀","desc":"놓는 순간의 속도를 기억한 뒤, 매 프레임 마찰 계수(0.94 안팎)를 곱해 속도가 보이지 않을 만큼 작아질 때까지 계속 미끄러집니다.","when":"커스텀 캐러셀, 지도 패닝, 드래그 가능한 캔버스. 관성 없는 드래그는 인터페이스가 손가락에 들러붙어 떨어지지 않는 느낌을 줍니다."},"rubber":{"title":"러버 밴드","desc":"경계를 넘어서면 이동량이 제곱근처럼 압축됩니다 — 멀리 끌수록 늘어나는 양은 줄어들고, 놓으면 튕겨 돌아옵니다. iOS에서 끝까지 스크롤했을 때의 그 손맛입니다.","when":"커스텀 스크롤 컨테이너, 당겨서 닫는 드로어, 캐러셀의 양 끝. ‘더 갈 수 있나?’라는 질문에 촉각적으로 답해 줍니다."},"particles":{"title":"파티클","desc":"각자 속도를 가진 수백 개의 점을 canvas에 매 프레임 다시 그립니다. DOM은 이 물량을 감당하지 못합니다 — 움직이는 요소가 60개를 넘으면 canvas로 갈아타세요.","when":"배경 분위기, 축하 콘페티, 데이터 포인트의 파티클화. 화면을 벗어날 때 cancelAnimationFrame을 잊지 마세요 — 안 그러면 배경이 계속 배터리를 먹습니다."},"ripple":{"title":"리플","desc":"실제 터치 지점에서 원이 퍼져 나가며 커지는 동시에 사라집니다. 핵심은 원의 중심을 컴포넌트 중앙이 아니라 클릭 좌표에 두는 것 — 그래야 피드백으로 느껴집니다.","when":"버튼, 리스트 항목, 클릭 가능한 넓은 영역. ‘잘 받았습니다’를 가장 저렴하게 표현하는 방법입니다."},"tilt":{"title":"틸트 카드","desc":"커서 위치에 따라 rotateX / rotateY를 주면서, 하이라이트가 반대 방향으로 훑고 지나가게 합니다. 실물 재질처럼 보이게 하는 결정타는 이 하이라이트입니다.","when":"포트폴리오 카드, 상품 카드, 멤버십 카드. 각도는 ±12° 이내로 — 넘어가면 ‘입체’가 아니라 ‘비틀린’ 것이 됩니다."},"cardflip":{"title":"카드 플립","desc":"두 면을 겹쳐 놓고 뒷면을 미리 180° 돌려 둔 뒤 컨테이너 전체를 회전시킵니다. 카메라를 등진 면은 backface-visibility: hidden이 숨겨 줍니다.","when":"기억력 게임, 앞뒤 정보 전환, 통계 카드의 ‘자세히 보기’. 회전축은 X보다 Y가 자연스럽습니다 — 책이 그렇게 넘어가니까요."},"cube":{"title":"큐브","desc":"여섯 면을 각각 회전시키고 translateZ로 모서리 길이의 절반만큼 밀어낸 뒤, 부모에 preserve-3d를 줍니다. CSS 3D의 가장 기본적인 조립법입니다.","when":"로딩, 로고, 다면적인 데이터 전환. 모바일에서는 주의 — 3D 컴포지팅 레이어는 메모리를 많이 먹습니다."},"layerdepth":{"title":"레이어드 뎁스","desc":"커서가 움직이면 깊이가 다른 레이어들이 서로 다른 폭으로 반대 방향으로 밀립니다. 평면 이미지로 시점 변화를 위조하는 셈입니다.","when":"히어로 일러스트, 제품 사진, 카드 내부의 레이어. 이동량 배분이 시각적 원근감과 일치하지 않으면 어색해집니다."},"coverflow":{"title":"원근 리스트","desc":"항목이 Y축으로 회전하며 뒤로 밀려나 호를 이룹니다. 깊이 차이만으로 지금 무엇이 선택됐는지 전달되어 별도 표시가 필요 없습니다.","when":"커버 브라우징, 카드 선택기, 날짜 휠. iOS picker의 시각적 원형입니다."},"shimmer":{"title":"스켈레톤 시머","desc":"회색 블록 위로 사선 하이라이트가 스쳐 지나갑니다. 예뻐 보이려는 게 아니라 ‘여기는 비어 있는 게 아니라 로딩 중’이라고 알리는 역할입니다.","when":"데이터 로딩 중. 스켈레톤의 형태를 실제 콘텐츠와 비슷하게 맞추지 않으면, 콘텐츠가 도착할 때 보기 흉한 리플로우가 한 번 일어납니다."},"gradflow":{"title":"그레이디언트 플로우","desc":"그레이디언트를 컨테이너보다 몇 배 크게 만든 뒤 background-position을 움직입니다. 실제로 움직이는 요소는 없는데 표면 전체가 숨 쉬는 것처럼 느껴집니다.","when":"히어로 배경, ‘AI 생성 중’ 상태, 브랜드 무드. 속도는 느리게(8s 이상) — 빠르면 시끄럽습니다."},"glow":{"title":"글로우 펄스","desc":"box-shadow의 블러 반경과 투명도가 동기화되어 변합니다. 리듬을 일부러 사람의 호흡(3–4초에 한 번)에 맞춰야 불안이 아니라 평온으로 읽힙니다.","when":"녹음 중, AI가 듣는 중, 대기 중인 음성 비서. 급한 깜빡임은 경고이고, 느린 호흡은 기다림입니다."},"grain":{"title":"필름 그레인","desc":"SVG의 feTurbulence로 만든 노이즈 레이어를 위에 얹고 살짝 흔들어 줍니다. 디지털 그레이디언트는 너무 깨끗해서, 그레인을 더해야 실물감이 생깁니다.","when":"에디토리얼 레이아웃, 음악·영상 제품. 불투명도는 6–12%로 억제하세요 — 넘어가면 그냥 지저분해 보입니다."},"glass":{"title":"글래스모피즘","desc":"backdrop-filter는 요소 ‘뒤에 있는’ 것을 흐립니다. 이것이 계층 관계를 만듭니다: 흐린 층은 뒤에, 선명한 층은 앞에.","when":"떠 있는 툴바, 모달 배경, iOS 스타일 시트. backdrop-filter는 비쌉니다 — 스크롤되는 긴 리스트에는 쓰지 마세요."},"goo":{"title":"구이 / 메타볼","desc":"먼저 가우시안 블러를 걸고 feColorMatrix로 알파 대비를 극단까지 끌어올리면, 흐려진 가장자리가 다시 딱딱한 경계로 ‘잘려’ 가까이 있는 도형끼리 들러붙습니다.","when":"펼쳐지는 플로팅 액션 버튼, 유기적인 로더, 브랜드 장식. 필터 비용이 크니 적용 범위는 작을수록 좋습니다."},"glitch":{"title":"글리치","desc":"같은 텍스트를 세 겹으로 쌓고, 두 개의 가상 요소를 clip-path로 서로 다른 가로 띠로 잘라 좌우로 어긋나게 한 뒤, 자르는 위치를 빠르게 튀게 합니다.","when":"게임, 음악, 해커 스타일 비주얼. 짧고 드물게 유지하세요 — 오래 깜빡이면 불쾌감을 주고 광과민 반응을 유발할 수 있습니다."},"chromatic":{"title":"색수차","desc":"빨강과 시안 채널을 서로 반대 방향으로 몇 픽셀 어긋나게 해 렌즈 가장자리의 색분산을 흉내 냅니다. 비용은 아주 가볍고, 분위기는 아주 강합니다.","when":"헤드라인의 미세한 술렁임, 호버 피드백, 레트로 CRT 질감. 오프셋은 1–3px이면 충분합니다."},"sprite":{"title":"스프라이트 / steps()","desc":"프레임들을 한 줄로 늘어놓고 steps()로 이동을 ‘미끄러짐’이 아니라 ‘점프’로 만듭니다. 전통 셀 애니메이션을 CSS로 직역한 것입니다.","when":"픽셀 아트, 손그림 프레임 애니메이션, GIF의 대체재(파일이 더 작고 재생 제어 가능). 프레임 수와 시간이 나누어떨어지지 않으면 떨립니다."},"wave":{"title":"웨이브 그리드","desc":"delay를 좌표의 함수(예: (x+y) × 0.06s)로 설정하면, 요소들의 그리드 전체가 제각각 움직이는 대신 파문처럼 퍼져 나갑니다.","when":"데이터 그리드 로딩, 오디오 시각화, 배경 장식. ‘delay로 방정식을 쓰는’ 가장 직관적인 예입니다."},"curtain":{"title":"커튼 전환","desc":"여러 장의 색 패널이 차례로 화면을 덮고, 완전히 가려진 순간 콘텐츠를 교체한 뒤 차례로 물러납니다. 이전 콘텐츠가 정확히 언제 사라졌는지는 막 뒤에 완전히 숨겨집니다.","when":"페이지 전환, 챕터 구분. View Transitions를 쓸 수 없을 때 내비게이션 깜빡임을 가리는 가장 확실한 방법입니다."},"dissolve":{"title":"픽셀 디졸브","desc":"화면을 그리드로 자르고 각 칸을 무작위 delay로 사라지게 합니다. 이 무작위성 덕분에 ‘애니메이션’이 아니라 물질이 붕괴하는 것처럼 보입니다.","when":"삭제, 파기, 데이터 소거 피드백. 단순 페이드보다 ‘정말로 없어졌다’는 실감을 훨씬 강하게 줍니다."},"liquidnav":{"title":"탄성 인디케이터","desc":"인디케이터가 이동 중에 가로로 늘어났다가 도착하면 원래 모양으로 수축합니다. scaleX 하나로 두 지점 사이 이동에 팔로 스루 원칙을 적용한 것입니다.","when":"탭, 하단 내비게이션, 세그먼트 컨트롤. 순수 기능성 컴포넌트가 개성을 가질 수 있는 몇 안 되는 자리입니다."},"orbit":{"title":"오빗","desc":"부모가 궤도를 회전시키고 자식이 반대로 회전해 자전을 상쇄하면, 오브젝트가 정면을 유지한 채 원주를 따라 돕니다. 합성 transform의 고전적인 연습 문제입니다.","when":"기술 아키텍처 다이어그램, 통합 생태계 쇼케이스, 멀티 노드 로딩 상태."},"startingstyle":{"title":"@starting-style","desc":"요소가 화면에 나타나는 ‘바로 그 순간’의 모습을 선언합니다. 예전에는 DOM에 막 삽입된 요소는 비교할 이전 상태가 없어 transition이 아예 발화하지 않았고, 강제로 reflow를 일으켜 브라우저를 속이는 수밖에 없었습니다.","when":"동적으로 삽입되는 모든 요소: 토스트, 드롭다운, 방금 로드된 카드. 십수 년간 CSS 등장 애니메이션에서 가장 크게 비어 있던 퍼즐 조각입니다."},"discrete":{"title":"allow-discrete","desc":"display처럼 ‘중간값이 없는’ 속성은 예전엔 transition에서 완전히 배제됐습니다. allow-discrete는 이런 값을 전환의 시작과 끝에서 스위칭하게 하고, 그 사이 과정은 다른 속성들이 연기하게 합니다.","when":"popover, <dialog>, display: none을 드나드는 모든 것. @starting-style과 함께 3종 세트를 이루면 JS는 class 하나만 토글해도 양방향 모두 움직입니다."},"autoheight":{"title":"calc-size()","desc":"interpolate-size: allow-keywords는 auto, min-content 같은 키워드를 트위닝 가능한 값으로 바꿔 줍니다. 높이 확장에 드디어 scrollHeight를 재서 px로 박아 넣을 필요가 없어졌습니다.","when":"아코디언, ‘더 보기’, 채팅 메시지 스레드. 이 도감의 ‘높이 자동 확장’ 카드가 쓰는 grid-template-rows: 0fr→1fr를 대체합니다 — 다만 지원이 부족한 환경에서는 여전히 옛 기법이 정답이니 서둘러 전면 교체하지는 마세요."},"linearspring":{"title":"linear() 이징","desc":"linear()는 샘플 포인트의 나열로 임의의 곡선을 기술합니다. cubic-bezier는 제어점이 둘뿐이라 오버슈트를 한 번밖에 못 하지만, linear()는 여러 번 진동할 수 있습니다 — 즉 스프링에 더 이상 JavaScript가 필요 없습니다.","when":"애니메이션 라이브러리 없이 탱탱한 개성이 필요할 때. 세 가지 프리셋 이름은 그대로 베껴 쓸 수 있습니다 — 이 어휘는 SwiftUI의 .smooth / .snappy / .bouncy와 정확히 대응합니다."},"propgradient":{"title":"@property","desc":"타입이 등록되지 않은 커스텀 속성은 브라우저에게 그냥 문자열이라, 애니메이션 도중 50% 지점에서 값이 뚝 건너뜁니다. @property로 syntax를 선언해야 비로소 진짜 각도·색·길이가 됩니다.","when":"회전하는 그레이디언트, 색상 정지점 등 ‘원래는 트위닝 불가능했던’ 모든 것. 왼쪽은 등록됨, 오른쪽은 미등록 — 차이가 한눈에 보입니다."},"multitrack":{"title":"멀티트랙 키프레임","desc":"하나의 @keyframes 블록 안 모든 속성은 같은 타임라인을 공유합니다. 회전과 이동에 각자의 리듬을 주려면 CSS에서는 중첩 요소로 쪼개야 합니다 — 여러 animation이 동시에 transform을 쓰면 서로 덮어쓰기 때문입니다.","when":"유기적인 상시 모션, 마스코트, 복합 로딩 애니메이션. SwiftUI의 KeyframeAnimator는 KeyframeTrack으로 이를 네이티브 지원합니다 — CSS가 유독 힘겨워하는 몇 안 되는 지점입니다."},"vt-custom":{"title":"old / new 커스터마이즈","desc":"기본 전환은 이전 화면을 페이드아웃하고 새 화면을 페이드인할 뿐입니다. ::view-transition-old()와 -new()에 각각 애니메이션을 걸면, 이전 화면은 왼쪽으로 빠지고 새 화면은 오른쪽에서 들어오게 만들 수 있습니다.","when":"탭 전환, 단계 플로우 등 방향감이 있는 모든 콘텐츠 교체. 네이티브 전환을 ‘쓸 만한’ 수준에서 ‘좋은’ 수준으로 끌어올리는 첫걸음입니다."},"vt-group":{"title":"::view-transition-group()","desc":"같은 이름을 가진 요소 사이의 위치·크기 변화는 group 레이어가 담당합니다. 여기에 animation-duration과 커브를 지정하면 모핑이 얼마나 빠르게 진행될지, 오버슈트할지를 정할 수 있습니다.","when":"공유 요소 전환에 개성이 필요할 때. 이전·새 콘텐츠의 페이드는 old/new가, 형태가 어떻게 날아갈지는 group이 맡으므로 둘을 따로따로 조율할 수 있습니다."},"vt-types":{"title":"방향 인식 전환","desc":"startViewTransition에 types를 실어 보내고, CSS 쪽에서 :active-view-transition-type()으로 받습니다. 같은 요소들이 앞으로 갈 때와 뒤로 갈 때 완전히 반대되는 애니메이션을 재생할 수 있습니다.","when":"앞뒤 순서가 있는 내비게이션: 페이지네이션, 위저드 플로우, 방문 기록. 방향감 없는 전환은 사용자가 ‘내가 어디에 있는지’를 잃게 만듭니다."},"vt-clash":{"title":"이름 충돌은 조용히 실패","desc":"같은 순간에 두 요소가 같은 view-transition-name을 가지면 전환 전체가 그냥 건너뛰어집니다 — 화면은 뚝 끊기고 콘솔은 조용합니다. 왼쪽은 고유한 이름, 오른쪽은 중복 — 클릭해서 차이를 확인하세요.","when":"디버깅용 카드입니다. 전환이 ‘아무 일도 안 하는데 에러도 없을’ 때 가장 먼저 확인할 것이 이름 충돌입니다 — 특히 컴포넌트가 반복 렌더링되는 리스트에서요."},"vt-list":{"title":"리스트 → 상세 확장","desc":"클릭한 항목의 섬네일과 제목에 view-transition-name을 임시로 붙이고, 전환이 끝나면 제거합니다. 이름이 필요한 그 순간에만 존재하므로 리스트의 다른 항목과 절대 충돌하지 않습니다.","when":"리스트 → 상세, 상품 → 상품 페이지, 앨범 → 원본 이미지. 네이티브 앱 느낌의 가장 큰 원천이며, 프레임워크가 전혀 필요 없습니다."},"vt-mpa":{"title":"크로스 도큐먼트 전환","desc":"@view-transition { navigation: auto } 한 줄이면 동일 출처의 ‘진짜 페이지 이동’에도 전환이 붙습니다. 아래 iframe 안에는 독립된 .html 파일 두 개가 들어 있습니다: 프레임워크도, SPA 라우터도 없습니다.","when":"블로그, 문서 사이트, 이커머스 등 모든 멀티 페이지 사이트. 예전에는 앱급 전환을 위해 사이트 전체를 SPA로 다시 짜야 했지만, 이제는 아닙니다."}},"laws":[{"title":"스쿼시 & 스트레치 (Squash & Stretch)","desc":"버튼이 눌리는 순간 살짝 납작해졌다가 놓으면 되튕깁니다. 부피가 보존되는 변형은 컴포넌트를 스티커 한 장이 아니라 재질과 무게가 있는 물체로 만들어 줍니다."},{"title":"예비 동작 (Anticipation)","desc":"메뉴가 열리기 전에 반대 방향으로 살짝 움츠립니다. ‘곧 무슨 일이 일어난다’는 신호를 눈에 먼저 주어야, 뒤따르는 본동작이 의도된 것으로 읽힙니다."},{"title":"스테이징 (Staging)","desc":"한 번에 하나만 주인공이어야 합니다. 세 가지가 동시에 움직이면 아무것도 움직이지 않는 것과 같습니다 — 시선이 놓일 곳이 없습니다."},{"title":"포즈 투 포즈 (Pose to Pose)","desc":"인터페이스는 거의 전부 pose to pose입니다: A 상태와 B 상태를 정의하고 중간은 트위닝에 맡깁니다. CSS transition이 바로 이 사고방식입니다."},{"title":"팔로 스루 (Follow Through)","desc":"카드가 멈추면 안의 텍스트는 40–80ms 늦게 멈춥니다. 물체는 일사불란하게 동시에 제동하지 않습니다 — 어긋남이 생동감을 만듭니다."},{"title":"슬로 인 & 슬로 아웃 (Slow In & Out)","desc":"현실에는 등속 운동이 없습니다. <code>linear</code>는 무한 회전 로딩과 마퀴에만 남겨 두고, 나머지는 전부 ease를 씁니다."},{"title":"호 (Arc)","desc":"자연스러운 운동은 곡선을 그립니다. 직선 이동은 기계적으로 보입니다 — <code>offset-path</code>를 쓰거나 X/Y에 서로 다른 easing을 주면 호를 만들 수 있습니다."},{"title":"보조 동작 (Secondary Action)","desc":"본동작 밖의 작은 디테일: 카드가 떠오를 때 그림자가 함께 짙어지고 퍼집니다. 본동작을 강화하는 역할이지, 주연을 빼앗아서는 안 됩니다."},{"title":"타이밍 (Timing)","desc":"지속 시간이 곧 무게입니다. 같은 이동도 300ms면 가볍고 800ms면 둔중합니다. 커브보다 시간을 바꾸는 쪽이 개성을 더 크게 바꿉니다."},{"title":"과장 (Exaggeration)","desc":"목표를 지나쳤다가 되돌아오는 쪽이 정확히 착지하는 것보다 설득력 있습니다. 오버슈트 커브 <code>cubic-bezier(.34,1.56,.64,1)</code>이 이 원칙 그 자체입니다."},{"title":"입체 표현 (Solid Drawing)","desc":"3D 전환에는 반드시 <code>perspective</code>를 주세요. 없으면 플립이 두께 있는 물체가 아니라 눌린 종잇장처럼 보입니다."},{"title":"매력 (Appeal)","desc":"모션은 제품의 억양입니다. 사이트 전체가 하나의 easing 세트와 시간 단계를 공유해야, 사용자가 ‘이 앱은 개성이 있다’고 느낍니다."}],"rules":[{"title":"transform과 opacity만 움직이기","desc":"이 둘은 GPU 컴포지팅에 통째로 맡길 수 있습니다. <code>width/top/margin</code>을 움직이면 layout이 발생해 60fps가 즉시 무너집니다."},{"title":"퇴장은 언제나 등장보다 빠르게","desc":"흔한 비율은 2:1. 등장은 초대이고 퇴장은 비켜 주는 일입니다 — 이미 닫아 버린 것을 기다리고 싶은 사용자는 없습니다."},{"title":"중단 가능하게","desc":"사용자가 도중에 마음을 바꾸면 애니메이션은 현재 상태에서 이어져야지, 끝까지 재생한 뒤 반응해서는 안 됩니다. 이 문제는 CSS보다 Web Animations API가 다루기 좋습니다."},{"title":"reduced-motion 존중하기","desc":"전정 기관이 예민한 사용자는 패럴랙스와 큰 이동에 어지럼을 느낍니다. <code>@media (prefers-reduced-motion:reduce)</code>에서 단순 페이드로 강등하세요 — 모션을 통째로 꺼 버리지는 마세요."},{"title":"애니메이션은 상태의 설명","desc":"좋은 모션은 ‘이게 어디서 왔고 어디로 가는가’에 답합니다. 답하지 못하는 애니메이션은 장식이니 잘라 내세요."},{"title":"일관성이 화려함을 이긴다","desc":"사이트 전체에 easing 3종, 시간 단계 4개면 충분합니다. 컴포넌트마다 커브를 따로 만든다는 건 디자인 시스템이 없다는 뜻입니다."}],"other":[{"title":"KeyframeAnimator 멀티트랙","desc":"속성마다 독립된 타임라인을 갖습니다. CSS는 <code>@keyframes</code> 한 블록에 모든 속성이 묶여 있어, 나누려면 요소를 중첩하는 수밖에 없습니다."},{"title":"PhaseAnimator 단계 시퀀스","desc":"이산적인 단계의 나열로 구동되며, 단계가 바뀔 때마다 자동으로 트위닝됩니다. 웹에서는 state machine을 직접 짜고 class를 토글해야 합니다."},{"title":"scrollTransition의 phase","desc":"<code>.topLeading</code> / <code>.identity</code> / <code>.bottomTrailing</code>의 3단계 모델로, IntersectionObserver의 ‘들어왔나 아닌가’ 불리언보다 훨씬 섬세합니다."},{"title":".symbolEffect()","desc":"SF Symbols에는 bounce / pulse / variableColor / replace가 내장되어 있습니다. 웹에는 ‘아이콘이 자기 애니메이션을 갖고 있다’는 개념 자체가 없습니다."},{"title":"시맨틱 spring 프리셋","desc":"<code>.smooth</code> / <code>.snappy</code> / <code>.bouncy</code>는 물리 파라미터를 디자인 어휘로 포장합니다. CSS는 <code>linear()</code>로 근사할 수 있을 뿐, 공통된 명명이 없습니다."},{"title":".contentTransition(.numericText())","desc":"시스템 차원의 숫자 롤링입니다. 이 도감의 ‘숫자 카운터’ 카드는 rAF로 직접 깎아 만든 것입니다."},{"title":".sensoryFeedback 햅틱 동기화","desc":"모션 표현의 네 번째 차원입니다. 웹에는 빈약한 Vibration API뿐이고, 데스크톱에는 그마저도 없습니다."},{"title":"Liquid Glass","desc":"<code>GlassEffectContainer</code> + <code>glassEffectID</code>(iOS 26)는 시스템 차원의 리퀴드 글래스입니다: 인터랙티브하고, 제스처에 따라 굴절하며, 모핑까지 합니다. 이 도감의 ‘구이 / 메타볼’ 카드는 SVG 필터로 겉모습만 흉내 낸 것입니다."},{"title":"Hero","desc":"두 라우트의 컴포넌트에 같은 tag만 붙이면 공유 요소 전환이 완성됩니다. 웹은 FLIP을 손으로 깎거나, 아직 보급 중인 View Transitions를 써야 합니다."},{"title":"Curves 대가족","desc":"이름 붙은 커브가 40종 이상(<code>easeOutBack</code>, <code>elasticIn</code>, <code>bounceOut</code>…). cubic-bezier의 숫자 네 개를 외울 필요가 없습니다."},{"title":"Impeller의 셰이더 프리워밍","desc":"<code>.frag</code> 셰이더는 컴파일 타임에 미리 컴파일됩니다. 웹처럼 셰이더 첫 실행에서 버벅이는 일이 없습니다."}],"cross":[{"concept":"이징 커브","flutter":"<code>Curves.easeOutCubic</code>(내장 명명 커브 40+종)","swiftui":"<code>.easeOut</code>, 또는 시맨틱한 <code>.smooth</code> / <code>.snappy</code> / <code>.bouncy</code>"},{"concept":"키프레임","css":"<code>@keyframes</code>(모든 속성이 하나의 타임라인을 공유)","swiftui":"<code>KeyframeAnimator</code>(속성마다 <code>KeyframeTrack</code> 하나)"},{"concept":"상태 변화 자동 트위닝"},{"concept":"재생 수동 제어","flutter":"<code>AnimationController</code>(explicit — <code>dispose</code> 잊지 말 것)","swiftui":"<code>withAnimation</code> + 커스텀 상태"},{"concept":"공유 요소 전환","css":"FLIP 수작업 / View Transitions API","flutter":"<code>Hero</code>(같은 tag만 붙이면 끝 — 거의 공짜)"},{"concept":"스프링 물리","css":"<code>linear()</code> 근사 / JS 프레임 단위 시뮬레이션"},{"concept":"스태거","flutter":"컨트롤러 하나를 <code>Interval</code>로 분할"},{"concept":"스크롤 연동","swiftui":"<code>scrollTransition</code>(3단계 phase)"},{"concept":"머티리얼 블러"},{"concept":"커스텀 드로잉"},{"concept":"셰이더 / 필터"},{"concept":"페이지 전환","swiftui":"NavigationStack 전환, <code>.zoom</code>"},{"concept":"중단 가능한 제스처 전환","css":"전부 수작업","flutter":"제스처와 컨트롤러를 직접 연결","swiftui":"시스템 내장 — iOS의 시그니처"}],"duration":[{"when":"호버 / 프레스 피드백","why":"포인터에 붙어 있는 느낌이어야 합니다. 200ms를 넘으면 ‘렉’으로 느껴집니다."},{"when":"작은 요소 열고 닫기<br>(툴팁, 드롭다운)","curve":"등장 <code>ease-out</code><br>퇴장 <code>ease-in</code>","why":"등장은 즉시 보여야 하므로 빠르게 시작해 느리게 끝내고, 퇴장은 사용자가 이미 관심을 거둔 뒤이므로 느리게 출발해 빠르게 비켜 줍니다."},{"when":"카드 확장 / 드로어 / 모달","why":"면적도 이동량도 커서, 공간 관계를 설명할 시간이 필요합니다."},{"when":"페이지 전환","why":"양 끝은 느리고 중간은 빠르게 — 순간이동이 아니라 카메라 이동처럼 느껴집니다."},{"when":"큰 오브젝트 이동 / 드래그 릴리스","curve":"강성 0.08 / 감쇠 0.75","why":"관성이 있는 것에 고정 시간은 어울리지 않습니다. duration보다 물리 시뮬레이션이 정확합니다."},{"when":"로딩 / 마퀴","why":"무한 루프에 ease를 넣으면 이음새마다 ‘심장박동’ 같은 마디가 생겨 오히려 덜 매끄럽습니다."},{"when":"리스트 항목 순차 등장","dur":"항목당 delay 30–60ms","why":"간격이 너무 넓으면 마지막 항목이 한없이 기다립니다. 8개를 넘으면 묶어서 처리하거나 단일 그룹 애니메이션으로 바꾸세요."}]}};
/* __PACKS_END__ */
(function mergePacks(){
  /* 依 index 把翻譯合併回 {zh,en,...} 物件；來源欄位是共用字串（程式碼／術語）就跳過 */
  const mergeRows=(src,rows,lg)=>{ if(!rows)return; rows.forEach((row,i)=>{ const s=src[i]; if(!s)return;
    for(const k in row){ const t=s[k]; if(t&&typeof t==='object')t[lg]=row[k]; } }); };
  for(const [lg,p] of Object.entries(PACKS)){
    UI[lg]=Object.assign({},UI.en,p.ui,{copyAll:n=>String(p.ui.copyAll).replace('{n}',n)});
    TRIG[lg]=p.trig||TRIG.en;
    CAT_L[lg]=p.cats||CAT_EN;
    mergeRows(LAWS,p.laws,lg); mergeRows(RULES,p.rules,lg); mergeRows(OTHER_PLATFORM,p.other,lg);
    mergeRows(CROSS_TABLE,p.cross,lg); mergeRows(DURATION_TABLE,p.duration,lg);
  }
})();

/* 語系（預設繁中，記住選擇） */
let curLang=localStorage.getItem('dmLang');
if(QS.get('lang'))curLang=QS.get('lang');
if(!HTML_LANG[curLang]||(curLang!=='zh'&&curLang!=='en'&&!PACKS[curLang]))curLang='zh';
function applyLang(){
  const t=UI[curLang];
  document.documentElement.lang=HTML_LANG[curLang]||'en';
  if(t.docTitle)document.title=t.docTitle;
  $('#heroTitle').innerHTML=t.heroTitle;
  $('#heroLede').innerHTML=t.lede;
  $('#search').placeholder=t.searchPh;
  $('#fwlab').textContent=t.fwLab;
  $('#fw').title=t.fwTitle;
  $('#replayAll').textContent=t.replayAll;
  $('#motionBtn').textContent=document.documentElement.classList.contains('no-motion')?t.motionOn:t.motionOff;
  $('#themeBtn').title=t.themeTitle;
  $('#langSel').innerHTML=LANGS.filter(([id])=>id==='zh'||id==='en'||PACKS[id])
    .map(([id,lab])=>'<option value="'+id+'"'+(id===curLang?' selected':'')+'>'+lab+'</option>').join('');
  $('#langSel').title=t.langTitle;
  $('#s01n').textContent=t.s01n;
  $('#s01h').textContent=t.s01h;
  $('#s01d').textContent=t.s01d;
  $('#empty').textContent=t.empty;
  $('#footerText').innerHTML=t.footer;
  renderFw();
  renderChips();
  renderGallery();
  renderTheory();
  applyFilter();
}
$('#langSel').onchange=e=>{
  curLang=e.target.value;
  try{localStorage.setItem('dmLang',curLang);}catch(_){}
  applyLang();
};

/* 初始化順序：語言／主題先套用（會把整個頁面渲染出來），reduced-motion 最後檢查，
   因為它要在卡片已經存在的狀態下才能正確暫停示範。 */
applyTheme();
applyLang();
if(matchMedia('(prefers-reduced-motion: reduce)').matches){
  setMotion(true); rmShown=true; $('#rmNotice').hidden=false;
}

/* 深連結：#t-<id> 直接捲到該卡片（示範動畫由 IntersectionObserver 進場時自動掛載） */
if(location.hash.startsWith('#t-')){
  const el=document.getElementById(location.hash.slice(1));
  if(el)setTimeout(()=>el.scrollIntoView(),60);
}

$('#stCount').textContent=DEMOS.length;
$('#stCat').textContent=CATS.length;
</script>
